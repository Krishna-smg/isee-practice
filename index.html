<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primary 4 Practice Tests — Unofficial ISEE-style practice</title>
<style>
:root{--navy:#1b2b4b;--navy2:#26406e;--tool:#dce9f6;--toolb:#b9d2ec;--ink:#1f2933;--muted:#5f6b7a;--line:#cfd6df;--bg:#f3f5f8;--green:#2e7d32;--green2:#256528;--red:#c62828;--amber:#b7791f;--blue:#1f5fa8;--fs:19px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
#app{min-height:100vh;display:flex;flex-direction:column}
#app.fixed{height:100vh;height:100dvh;overflow:hidden}
.notice{background:#fff8e1;color:#6d4c00;text-align:center;font-size:13px;padding:3px 8px;border-bottom:1px solid #f0dca0}
.notice.foot{border-top:1px solid #f0dca0;border-bottom:none;margin-top:auto}
.page{max-width:1000px;margin:0 auto;padding:22px 26px;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:16px}
h1{font-size:28px;margin:4px 0;color:var(--navy)}
h2{font-size:21px;margin:0 0 10px;color:var(--navy)}
h3{font-size:18px;margin:14px 0 6px;color:var(--navy)}
.muted{color:var(--muted)}
.btn{background:var(--navy2);color:#fff;border:1px solid var(--navy2);border-radius:5px;padding:9px 20px;font-weight:600;min-height:44px}
.btn:hover{background:var(--navy)}
.btn.sec{background:#fff;color:var(--navy2)}
.btn.green{background:var(--green);border-color:var(--green)}.btn.green:hover{background:var(--green2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn:disabled{background:#a7b1bd;border-color:#a7b1bd;color:#fff}
.btn.small{padding:4px 12px;min-height:36px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{font:inherit;padding:9px 12px;border:1px solid #9aa6b4;border-radius:5px;width:100%;max-width:380px}
.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tpick{border:2px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff;text-align:left}
.tpick.sel{border-color:var(--blue);background:#eef5fd}
.tpick b{font-size:18px;color:var(--navy)}
.lvl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:2px}
.lvl.Standard{background:#e3f1e4;color:#1b5e20}.lvl.Challenge{background:#fde8e8;color:#8e1c1c}
table.grid{border-collapse:collapse;width:100%;font-size:15px}
table.grid td,table.grid th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.grid th{background:#eef2f7}
label.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
label.opt input{width:20px;height:20px;margin-top:3px}
.banner{border:1px solid #e0b252;background:#fff8e6;border-radius:6px;padding:12px 16px;margin-bottom:14px}
/* ---------- test shell (modeled on the computer-based layout) ---------- */
.hdr{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;padding:6px 12px;min-height:54px}
.timer{display:flex;align-items:center;gap:7px;background:#fff;color:var(--navy);border-radius:4px;padding:3px 12px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:112px}
.timer svg{width:20px;height:20px}
.timer.warn{background:#ffe08a;color:#5a3c00}.timer.crit{background:#ffcdd2;color:#8e0000}
.hdr .mid{flex:1;text-align:center;line-height:1.2}
.hdr .sname{font-weight:700;font-size:17px}
.hdr .qof{font-size:14px;opacity:.9}
.hdr .who{text-align:right;font-size:14px;line-height:1.25}
.hdr .who b{font-size:15px}
.toolbar{display:flex;align-items:center;gap:6px;background:var(--tool);border-bottom:1px solid var(--toolb);padding:5px 10px;flex-wrap:wrap}
.tb{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--toolb);color:var(--navy);border-radius:4px;padding:4px 10px;min-height:38px;font-size:14px;font-weight:600}
.tb svg{width:20px;height:20px}
.tb.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.tb.flagged{background:#fdecea;border-color:#e57373;color:var(--red)}
.tb .s{text-decoration:line-through;font-weight:800}
.toolbar .sp{flex:1}
.itemlbl{font-weight:700;color:var(--navy);font-size:14px;padding:0 6px}
.warnbar{background:#fff3c4;color:#5a3c00;text-align:center;padding:5px;font-weight:600;font-size:15px;border-bottom:1px solid #e9cf74}
.main{flex:1;display:flex;min-height:0;overflow:hidden;background:#fff;font-size:var(--fs)}
.pane{overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.passage{flex:1 1 50%;padding:18px 26px 30px;border-right:4px solid #c9d2dc;background:#fff}
.passage h3{margin:0 0 4px;font-size:1.05em}
.passage .genre{font-size:.75em;color:var(--muted);margin-bottom:10px}
.passage p{margin:0 0 .85em}
.passage p .pn{display:inline-block;min-width:1.6em;color:#8a96a3;font-size:.7em;font-weight:700}
.passage.poem p{white-space:pre-line;margin-bottom:1.1em}
.passage .dir{font-size:.8em;color:var(--muted);font-style:italic;margin-bottom:10px}
.expand{position:absolute;top:0;right:0;background:#c9d2dc;color:#334;border:none;border-radius:0 0 0 6px;padding:3px 10px;font-size:13px;font-weight:700}
.main.expanded .question{display:none}.main.expanded .passage{border-right:none}
.question{flex:1 1 50%;padding:20px 28px 30px;background:#fbfcfd}
.main.single .question{max-width:920px;margin:0 auto;background:#fff}
.qtext{font-weight:600;margin-bottom:14px}
.qtable{border-collapse:collapse;margin:6px 0 14px;font-size:.9em}
.qtable td,.qtable th{border:1px solid #9aa6b4;padding:4px 14px;text-align:center}.qtable th{background:#eef2f7}
.choice{display:flex;align-items:stretch;margin-bottom:10px}
.choice .pick{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #aab5c2;border-radius:5px;padding:9px 14px;min-height:52px;color:var(--ink);font-size:1em}
.choice .pick:hover{border-color:var(--blue)}
.choice .pick .bub{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #7d8a99;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;color:#445}
.choice .pick.sel{border-color:var(--blue);background:#eaf2fc;box-shadow:inset 0 0 0 1px var(--blue)}
.choice .pick.sel .bub{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.crossed .ctext{text-decoration:line-through;color:#97a1ac}
.choice.crossed .bub{opacity:.45}
.choice .xo{margin-left:6px;width:44px;border:1px solid #aab5c2;background:#fff;border-radius:5px;color:#6b7785;font-weight:800}
.choice.crossed .xo{background:#fdecea;color:var(--red);border-color:#e57373}
.choice.right .pick{border-color:var(--green);background:#e8f5e9;box-shadow:inset 0 0 0 2px var(--green)}
.choice.right .bub{background:var(--green);border-color:var(--green);color:#fff}
.choice.wrong .pick{border-color:var(--red);background:#fdecea;box-shadow:inset 0 0 0 2px var(--red)}
.choice.wrong .bub{background:var(--red);border-color:var(--red);color:#fff}
.ctag{font-size:.7em;font-weight:700;margin-left:auto;padding-left:10px;white-space:nowrap}
.choice.right .ctag{color:var(--green)}.choice.wrong .ctag{color:var(--red)}
mark.hl{background:#fff176;color:inherit;cursor:pointer;border-radius:2px}
mark.ev{background:#c8e6c9;color:inherit;outline:2px solid #66bb6a;border-radius:2px}
.foot{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#e9eef4;border-top:1px solid var(--line)}
.foot .sp{flex:1}
.side{flex:0 0 340px;border-left:1px solid var(--line);background:#fffdf5;display:flex;flex-direction:column;padding:10px;font-size:15px}
.side h4{margin:2px 0 6px;color:var(--navy)}
.side textarea{flex:1;font:inherit;border:1px solid var(--line);border-radius:5px;padding:8px;resize:none;min-height:120px}
canvas.pad{background:#fff;border:1px solid var(--line);border-radius:5px;touch-action:none;width:100%;flex:1;min-height:200px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:8px;padding:20px 24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
/* review your items */
.rv{flex:1;display:flex;gap:18px;padding:18px 22px;overflow:auto;background:#fff}
.rv .tbl{flex:1;min-width:0}
.rv table{border-collapse:collapse;width:100%;font-size:15px}
.rv td,.rv th{border:1px solid var(--line);padding:5px 10px;text-align:center}
.rv th{background:#eef2f7}
.rv td a{color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer}
.rv .panel{flex:0 0 280px;border:1px solid var(--line);border-radius:6px;padding:14px;background:#f8fafc;align-self:flex-start}
.rv .panel .btn{width:100%;margin-bottom:10px}
.ok{color:var(--green);font-weight:800}.flg{color:var(--red);font-weight:800}
/* report */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.score .box{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:#fff}
.score .big{font-size:34px;font-weight:800;color:var(--navy)}
.bar{height:10px;background:#e5e9ef;border-radius:5px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--blue)}
.marks{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:1px;word-break:break-all}
.marks .p{color:var(--green)}.marks .m{color:var(--red)}.marks .s{color:var(--amber)}.marks .n{color:#7b8794}
.tip{border-left:4px solid var(--amber);background:#fffaf0;padding:8px 12px;margin:8px 0;border-radius:4px;break-inside:avoid}
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:#fff}
.tchip.rush{background:#fff3e0;border-color:#ffb74d}.tchip.slow{background:#e3f2fd;border-color:#64b5f6}.tchip.wr{box-shadow:inset 0 -3px 0 var(--red)}
.fbtn{border:1px solid var(--toolb);background:#fff;border-radius:14px;padding:3px 12px;font-size:14px;font-weight:600;color:var(--navy)}
.fbtn.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.expl{margin-top:14px;border:1px solid var(--line);border-left:4px solid var(--blue);background:#f6f9fd;border-radius:4px;padding:10px 14px;font-size:.92em}
.sample{border:1px dashed #8aa4c4;border-radius:6px;padding:12px 16px;background:#fbfdff}
.center{text-align:center}
.bigclock{font-size:56px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
@media (max-width:900px){.side{flex-basis:280px}.rv{flex-direction:column}.rv .panel{flex-basis:auto;align-self:stretch}}
@media (orientation:portrait) and (max-width:900px){.main.split{flex-direction:column}.passage{border-right:none;border-bottom:4px solid #c9d2dc;flex-basis:48%}.side{position:fixed;right:0;top:0;bottom:0;width:85%;z-index:40;box-shadow:-4px 0 18px rgba(0,0,0,.2)}.tests{grid-template-columns:1fr}.hdr .who{display:none}}
@media print{.noprint,.hdr,.toolbar,.foot{display:none!important}body{background:#fff;font-size:12px}.card{border:none;padding:4px 0;margin:0 0 8px}.page{padding:0;max-width:none}.notice{background:none}table.grid{font-size:11px}.score .big{font-size:22px}}
</style>
</head>

<script>
const TESTS = [{"id":1,"level":"Standard","passages":[{"title":"The Kite That Would Not Fly","genre":"Fiction","poem":false,"paragraphs":["Ravi had spent all of Saturday morning building a kite from tissue paper, two thin sticks, and a roll of kitchen string. He painted a green dragon on the front and gave it a long tail made of ribbon scraps. When he finished, he carried it to the hill behind the community center, certain it would soar higher than any store-bought kite.","But each time he ran, the kite bounced along the grass like a tired frog and flopped onto its face. After the fifth try, Ravi threw himself down beside it. “It’s useless,” he muttered.","Aunt Bea, who had been watching from a bench, walked over and lifted the kite by its string. “It’s not useless. It’s heavy in the wrong place,” she said, pointing to the tail. The ribbon scraps were damp from the morning grass and had tangled into a thick knot. Ravi frowned. He had been so proud of that tail.","Together they trimmed the tail to half its length and untangled the knot. Then Aunt Bea held the kite high while Ravi backed away, letting the string grow tight. When a gust swept up the hill, she let go. The green dragon wobbled, dipped, and then climbed, its shorter tail snapping behind it. Ravi laughed so hard he nearly dropped the string.","On the walk home, he looked at the leftover ribbon in his pocket. “Next time,” he said, “I’ll test it before I decide it’s perfect.”"]},{"title":"Seeing With Sound: How Bats Find Their Way","genre":"Nonfiction / Science","poem":false,"paragraphs":["Many bats hunt at night, when it is far too dark to see insects. Instead of relying only on their eyes, these bats use a skill called echolocation. A bat makes high-pitched calls through its mouth or nose. The sound waves travel outward, hit objects, and bounce back as echoes. By listening to those echoes, the bat can tell where an object is, how big it is, and even which way it is moving.","Most of these calls are too high for human ears to hear. Scientists use special microphones called bat detectors to change the calls into sounds people can hear. When a bat closes in on a moth, its calls speed up into a quick buzz. The faster calls give the bat more information as the moth gets closer.","Not all bats use echolocation. Many fruit bats have large eyes and a strong sense of smell, which they use to find ripe fruit and flowers. As they travel, fruit bats help plants by carrying pollen from flower to flower.","Bats that eat insects are helpful too. A single little brown bat can catch hundreds of insects in one night, including mosquitoes. Farmers benefit because bats eat many insects that damage crops. Sadly, some bat populations are shrinking because of disease and the loss of places to roost. People can help by protecting caves and by putting up bat houses."]},{"title":"Emily Roebling and the Brooklyn Bridge","genre":"History / Biography","poem":false,"paragraphs":["In the 1860s, the main way to travel between the cities of Brooklyn and Manhattan in New York was by ferry across the East River. In winter, ice could make the crossing slow and dangerous. An engineer named John Roebling designed a bold solution: a huge bridge held up by steel cables hanging from two stone towers.","John Roebling died before construction began, so his son, Washington Roebling, became the chief engineer. Workers dug the towers’ foundations inside giant boxes sunk deep below the river. Many became sick from working under so much air pressure, and Washington was one of them. Before long he was too ill to visit the bridge. He watched the work through a telescope from his window.","His wife, Emily Warren Roebling, stepped in. She studied mathematics, the strength of materials, and how cables are built. Every day she carried Washington’s instructions to the engineers and brought their questions back to him. Officials and workers came to rely on her clear answers. Some people even believed she was the real engineer behind the bridge.","After about fourteen years of work, the Brooklyn Bridge opened on May 24, 1883. It was the longest suspension bridge in the world at that time. On opening day, Emily Roebling was the first person to ride across it. Today a plaque on the bridge honors Emily, Washington, and John Roebling together."]},{"title":"Snow Day Morning","genre":"Poetry","poem":true,"paragraphs":["The world is hushed when I wake up;\nthe yard has vanished overnight.\nThe fence wears thick white frosting caps,\nthe birdbath naps in quilts of white.","No engines hum, no doorbells ring,\nthe street is soft as a woolen shawl.\nA cardinal, one drop of red,\nis the only color left at all.","I tug on boots and zip my coat\nand loop my scarf around me twice,\nthen stamp the very first footprints\nacross a page of sugared ice.","By noon the sun will melt my tracks\nand school will open soon, I know—\nbut this one morning is all mine,\na gift wrapped up in falling snow."]}],"reading":[{"passage":0,"cat":"Supporting Details","text":"What did Ravi use to make the frame of his kite?","explanation":"Paragraph 1 lists what Ravi used: tissue paper, two thin sticks, and kitchen string. The sticks make the frame.","evidence":{"para":0,"text":"tissue paper, two thin sticks, and a roll of kitchen string"},"choices":["Two thin sticks","Plastic straws","A wire hanger","Strips of cardboard"],"answer":0,"n":1},{"passage":0,"cat":"Tone & Figurative Language","text":"The author says the kite “bounced along the grass like a tired frog.” This comparison helps the reader picture that the kite —","explanation":"A tired frog makes small, clumsy hops. The kite kept bouncing on the ground instead of flying.","evidence":{"para":1,"text":"bounced along the grass like a tired frog"},"choices":["was green and slimy","hopped clumsily and could not stay up","moved quickly through the air","was alive and hungry"],"answer":1,"n":2},{"passage":0,"cat":"Inference","text":"Why does Ravi say “It’s useless” after the fifth try?","explanation":"He worked all morning and the kite still won’t fly. Throwing himself on the ground shows frustration.","evidence":{"para":1,"text":"After the fifth try, Ravi threw himself down beside it."},"choices":["He wants to buy a store kite instead.","Aunt Bea told him the kite was broken.","He feels frustrated that his hard work is not paying off.","He is tired of being outside and wants to go home."],"answer":2,"n":3},{"passage":0,"cat":"Supporting Details","text":"According to Aunt Bea, what was wrong with the kite?","explanation":"Aunt Bea says, “It’s heavy in the wrong place,” and points to the wet, knotted tail.","evidence":{"para":2,"text":"It’s heavy in the wrong place"},"choices":["The string was too short.","The paint was too thick.","The sticks were cracked.","It was heavy in the wrong place."],"answer":3,"n":4},{"passage":0,"cat":"Vocabulary in Context","text":"In paragraph 4, the word gust most nearly means —","explanation":"Right after the gust swept up the hill, the kite climbed. A gust is a quick, strong push of moving air.","evidence":{"para":3,"text":"When a gust swept up the hill"},"choices":["a sudden rush of air","a loud noise","a small cloud","a long rope"],"answer":0,"n":5},{"passage":0,"cat":"Inference","text":"Why did Ravi frown when Aunt Bea pointed to the tail?","explanation":"The very next sentence explains: he had been so proud of that tail.","evidence":{"para":2,"text":"He had been so proud of that tail."},"choices":["He thought Aunt Bea was going to take the kite.","He had been proud of the tail and did not want to change it.","He was angry that the grass was wet.","He could not see the knot."],"answer":1,"n":6},{"passage":0,"cat":"Main Idea","text":"Which lesson does Ravi learn by the end of the story?","explanation":"Ravi says next time he will test it before deciding it’s perfect. Fixing the tail made the kite fly.","evidence":{"para":4,"text":"I’ll test it before I decide it’s perfect."},"choices":["Store-bought things are always better.","Kites should never have tails.","Testing and fixing your work can make it better.","It is best to work alone."],"answer":2,"n":7},{"passage":1,"cat":"Main Idea","text":"Which sentence best tells what the whole passage is about?","explanation":"The passage explains how bats find food (echolocation, eyes and smell) and how they help farmers and plants.","evidence":{"para":3,"text":"Bats that eat insects are helpful too."},"choices":["Bats are dangerous animals that people should avoid.","All bats use their eyes to hunt at night.","Scientists invented microphones to record music.","Bats find food in different ways and are helpful to people and plants."],"answer":3,"n":8},{"passage":1,"cat":"Supporting Details","text":"What happens when a bat’s sound waves hit an object?","explanation":"Paragraph 1 says the sound waves hit objects and bounce back as echoes.","evidence":{"para":0,"text":"hit objects, and bounce back as echoes"},"choices":["They bounce back as echoes.","They turn into light.","They disappear forever.","They make the object move."],"answer":0,"n":9},{"passage":1,"cat":"Vocabulary in Context","text":"In paragraph 2, the phrase closes in on means —","explanation":"The bat’s calls speed up as the moth gets closer, so “closes in on” means moving nearer.","evidence":{"para":1,"text":"When a bat closes in on a moth"},"choices":["shuts its eyes at","gets nearer to","runs away from","hides behind"],"answer":1,"n":10},{"passage":1,"cat":"Inference","text":"Why do a bat’s calls speed up as it gets close to a moth?","explanation":"The passage says the faster calls give the bat more information as the moth gets closer.","evidence":{"para":1,"text":"The faster calls give the bat more information as the moth gets closer."},"choices":["The bat is trying to scare the moth away.","The bat is calling other bats to share.","The bat needs more information to catch the moth.","The bat is getting tired."],"answer":2,"n":11},{"passage":1,"cat":"Supporting Details","text":"How do many fruit bats find their food?","explanation":"Paragraph 3 says many fruit bats use large eyes and a strong sense of smell.","evidence":{"para":2,"text":"Many fruit bats have large eyes and a strong sense of smell"},"choices":["By listening for buzzing insects","By following farmers","By using bat detectors","By using large eyes and a strong sense of smell"],"answer":3,"n":12},{"passage":1,"cat":"Organization & Logic","text":"Why does the author begin paragraph 3 with “Not all bats use echolocation”?","explanation":"This sentence switches from echo-hunting bats to fruit bats, which use eyes and smell instead.","evidence":{"para":2,"text":"Not all bats use echolocation."},"choices":["To introduce bats that find food in a different way","To prove that echolocation is not real","To explain how bat detectors work","To tell a story about one bat"],"answer":0,"n":13},{"passage":1,"cat":"Inference","text":"Based on the passage, why might a farmer put up a bat house?","explanation":"Farmers benefit because bats eat insects that damage crops. A bat house gives bats a place to roost nearby.","evidence":{"para":3,"text":"Farmers benefit because bats eat many insects that damage crops."},"choices":["So the farmer can sell bat detectors","So bats will live nearby and eat insects that harm crops","So the bats will eat the farmer’s fruit","So the barn will be quieter at night"],"answer":1,"n":14},{"passage":2,"cat":"Supporting Details","text":"Before the bridge was built, how did people mainly travel between Brooklyn and Manhattan?","explanation":"The first sentence says the main way to travel was by ferry across the East River.","evidence":{"para":0,"text":"was by ferry across the East River"},"choices":["By train through a tunnel","By walking across the frozen river","By ferry across the East River","By horse on a road around the river"],"answer":2,"n":15},{"passage":2,"cat":"Organization & Logic","text":"How is the passage mostly organized?","explanation":"It starts with the 1860s plan, then building problems, then Emily’s work, then the 1883 opening — time order.","evidence":{"para":3,"text":"After about fourteen years of work"},"choices":["As a list of reasons bridges are dangerous","By comparing two different bridges","As questions followed by answers","In time order, from the bridge’s design to its opening"],"answer":3,"n":16},{"passage":2,"cat":"Supporting Details","text":"Why did Washington Roebling watch the work through a telescope?","explanation":"Paragraph 2 says he became too ill to visit, so he watched from his window.","evidence":{"para":1,"text":"Before long he was too ill to visit the bridge."},"choices":["He was too ill to visit the bridge.","He wanted to look at ships.","The bridge was in another country.","He was afraid of heights."],"answer":0,"n":17},{"passage":2,"cat":"Vocabulary in Context","text":"In paragraph 3, the phrase stepped in means —","explanation":"Emily began carrying instructions and answering questions — she took over an important job when help was needed.","evidence":{"para":2,"text":"Emily Warren Roebling, stepped in"},"choices":["walked into a room","took on an important job to help","stepped onto the bridge","stopped working"],"answer":1,"n":18},{"passage":2,"cat":"Inference","text":"Why did officials and workers come to rely on Emily?","explanation":"She studied math, materials, and cables, so her answers were clear and trustworthy.","evidence":{"para":2,"text":"She studied mathematics, the strength of materials, and how cables are built."},"choices":["She owned the company that built the bridge.","She was the mayor of Brooklyn.","She had learned enough engineering to give clear, correct answers.","She did all the building herself."],"answer":2,"n":19},{"passage":2,"cat":"Inference","text":"Why was Emily most likely the first person to ride across the bridge?","explanation":"After all her work, letting her cross first was a way to honor her. The plaque also honors ":"Which number is sixty-two thousand, eight hundred four?","explanation":"Sixty-two thousand = 62,000. Eight hundred four = 804. 62,000 + 804 = 62,804.","table":null,"choices":["6,284","62,804","62,840","620,804"],"answer":1,"n":2},{"cat":"Number Sense & Operations","text":"What is 5,381 rounded to the nearest hundred?","explanation":"Look at the tens digit: 8. Since 8 is 5 or more, round the hundreds up: 5,381 → 5,400.","table":null,"choices":["5,000","5,300","5,380","5,400"],"answer":3,"n":3},{"cat":"Number Sense & Operations","text":"523 + 389 = ?","explanation":"3 + 9 = 12 (write 2, carry 1). 2 + 8 + 1 = 11 (write 1, carry 1). 5 + 3 + 1 = 9. Answer: 912.","table":null,"choices":["912","921","1,002","1,012"],"answer":0,"n":4},{"cat":"Number Sense & Operations","text":"802 − 375 = ?","explanation":"Regroup: 802 − 375 = 427. Check: 427 + 375 = 802.","table":null,"choices":["427","437","527","573"],"answer":0,"n":5},{"cat":"Number Sense & Operations","text":"A theater has 23 rows with 18 seats in each row. How many seats are there in all?","explanation":"23 × 18 = 23 × 10 + 23 × 8 = 230 + 184 = 414.","table":null,"choices":["41","394","414","424"],"answer":2,"n":6},{"cat":"Fractions & Decimals","text":"Which fraction names the same amount as 4/5?","explanation":"Multiply the top and bottom of 4/5 by 2: 8/10.","table":null,"choices":["4/10","8/10","5/4","8/5"],"answer":1,"n":7},{"cat":"Fractions & Decimals","text":"Which fraction is more than one half?","explanation":"Half of 8 is 4, so 5/8 is more than half. The others are less than half.","table":null,"choices":["1/4","2/6","3/8","5/8"],"answer":3,"n":8},{"cat":"Fractions & Decimals","text":"Ella ate 2/9 of a pie and her brother ate 4/9 of it. What fraction of the pie did they eat together?","explanation":"Same denominators: add the tops. 2/9 + 4/9 = 6/9. The bottom stays 9.","table":null,"choices":["2/9","6/18","6/9","8/9"],"answer":2,"n":9},{"cat":"Fractions & Decimals","text":"Which decimal means seven tenths?","explanation":"The first place after the decimal point is tenths, so seven tenths = 0.7.","table":null,"choices":["0.07","0.7","7.10","70.0"],"answer":1,"n":10},{"cat":"Fractions & Decimals","text":"Which list shows the decimals in order from least to greatest?","explanation":"Compare tenths: 0.2 has 2 tenths, 0.58 has 5 tenths, 0.9 has 9 tenths. Least to greatest: 0.2, 0.58, 0.9.","table":null,"choices":["0.9, 0.58, 0.2","0.58, 0.2, 0.9","0.2, 0.9, 0.58","0.2, 0.58, 0.9"],"answer":3,"n":11},{"cat":"Algebraic Thinking & Patterns","text":"What is the next number in the pattern? 4, 11, 18, 25, ___","explanation":"Each number is 7 more than the one before. 25 + 7 = 32.","table":null,"choices":["32","33","35","39"],"answer":0,"n":12},{"cat":"Algebraic Thinking & Patterns","text":"What number goes in the box? □ − 19 = 46","explanation":"Undo subtraction with addition: 46 + 19 = 65. Check: 65 − 19 = 46.","table":null,"choices":["27","55","65","75"],"answer":2,"n":13},{"cat":"Algebraic Thinking & Patterns","text":"A rule says “multiply by 3, then add 2.” What is the output when the input is 9?","explanation":"9 × 3 = 27, then 27 + 2 = 29.","table":null,"choices":["29","30","33","36"],"answer":0,"n":14},{"cat":"Algebraic Thinking & Patterns","text":"Jada had some marbles. She got 12 more, and now she has 31. Which equation can be used to find m, the number she started with?","explanation":"She started with m and added 12 to get 31, so m + 12 = 31. (m = 19.)","table":null,"choices":["m − 12 = 31","12 − m = 31","m × 12 = 31","m + 12 = 31"],"answer":3,"n":15},{"cat":"Geometry","text":"How many sides does a hexagon have?","explanation":"Hexa- means six. A hexagon has 6 sides.","table":null,"choices":["5","6","7","8"],"answer":1,"n":16},{"cat":"Geometry","text":"A rectangular picture frame is 11 inches long and 6 inches wide. How much ribbon is needed to go once around its edge?","explanation":"Going around is the perimeter: 11 + 6 + 11 + 6 = 34 inches.","table":null,"choices":["17 inches","28 inches","34 inches","66 inches"],"answer":2,"n":17},{"cat":"Geometry","text":"A rug is 9 feet long and 5 feet wide. What is its area?","explanation":"Area = length × width = 9 × 5 = 45 square feet.","table":null,"choices":["14 square feet","28 square feet","45 square feet","54 square feet"],"answer":2,"n":18},{"cat":"Geometry","text":"Which of these shapes always has four right angles?","explanation":"Every rectangle has four right angles. A rhombus or trapezoid might not, and a triangle has only 3 angles.","table":null,"choices":["Rhombus","Trapezoid","Triangle","Rectangle"],"answer":3,"n":19},{"cat":"Geometry","text":"How many lines of symmetry does a square have?","explanation":"A square folds evenly across 2 lines (up-down, side-side) and 2 diagonals: 4 lines.","table":null,"choices":["1","2","3","4"],"answer":3,"n":20},{"cat":"Measurement","text":"A soccer game started at 9:40 a.m. and lasted 1 hour 25 minutes. What time did it end?","explanation":"9:40 + 1 hour = 10:40. 10:40 + 20 minutes = 11:00, plus 5 more = 11:05 a.m.","table":null,"choices":["10:05 a.m.","10:55 a.m.","11:05 a.m.","11:15 a.m."],"answer":2,"n":21},{"cat":"Measurement","text":"How many minutes are in 4 hours?","explanation":"1 hour = 60 minutes, so 4 × 60 = 240 minutes.","table":null,"choices":["24","240","260","400"],"answer":1,"n":22},{"cat":"Measurement","text":"A jug holds 4 quarts of juice. How many cups is that? (1 quart = 4 cups)","explanation":"4 quarts × 4 cups each = 16 cups.","table":null,"choices":["8 cups","12 cups","16 cups","20 cups"],"answer":2,"n":23},{"cat":"Measurement","text":"Which unit is best for measuring the weight of a bicycle?","explanation":"A bicycle is heavy, so kilograms fit best. Grams are for light things; milliliters measure liquid; centimeters measure length.","table":null,"choices":["Kilograms","Grams","Milliliters","Centimeters"],"answer":0,"n":24},{"cat":"Data Analysis & Probability","text":"The table shows stickers collected by four friends. How many more stickers did Lena collect than Kenji?","explanation":"Lena 34 − Kenji 19 = 15.","table":[["Friend","Stickers"],["Rosa","31"],["Owen","26"],["Kenji","19"],["Lena","34"]],"choices":["15","16","25","53"],"answer":0,"n":25},{"cat":"Data Analysis & Probability","text":"Using the same table, what is the total number of stickers the four friends collected?","explanation":"31 + 26 = 57, 57 + 19 = 76, 76 + 34 = 110.","table":[["Friend","Stickers"],["Rosa","31"],["Owen","26"],["Kenji","19"],["Lena","34"]],"choices":["110","111","120","210"],"answer":0,"n":26},{"cat":"Data Analysis & Probability","text":"A bag has 5 red marbles, 3 blue marbles, and 2 green marbles. If you pick one without looking, which color are you most likely to pick?","explanation":"There are more red marbles (5) than any other color, so red is most likely.","table":null,"choices":["Blue","Red","Green","All colors are equally likely"],"answer":1,"n":27},{"cat":"Data Analysis & Probability","text":"In a pictograph, each ☺ stands for 3 students. How many ☺ symbols are needed to show 27 students?","explanation":"27 ÷ 3 = 9 symbols.","table":null,"choices":["3","9","24","30"],"answer":1,"n":28}]},{"id":2,"level":"Standard","passages":[{"title":"The Narrator Who Froze","genre":"Fiction","poem":false,"paragraphs":["Tomás had practiced his lines for the class play every night for two weeks. He was the narrator, which meant he would stand alone at the edge of the stage and tell the audience what was happening. At home in front of the mirror, his voice sounded strong and clear. His little sister, Lucía, even clapped when he finished.","But on the night of the play, the auditorium was packed. When the spotlight landed on Tomás, his mouth went dry and his mind went blank. He stared out at rows of faces that seemed to stretch forever. A long, terrible silence filled the room.","Then he spotted Lucía in the third row. She was holding up the cardboard star she had decorated for him that afternoon, waving it like a flag. Tomás remembered the mirror, and the clapping, and the way the words had felt like a song he already knew. He took a deep breath. “Once upon a time,” he began, “in a kingdom by the sea . . .”","After the final bow, Mrs. Adeyemi found him backstage. “You know what I noticed?” she said. “You got stuck, and then you got unstuck. That’s the hardest part of being on stage.” Tomás grinned. He decided that next year he might even try out for a part with more lines."]},{"title":"Water Bears: The Toughest Tiny Animals","genre":"Nonfiction / Science","poem":false,"paragraphs":["If you scoop up a clump of damp moss and look at it under a microscope, you might find one of the toughest animals on Earth. Tardigrades, also called water bears, are so small that most are less than one millimeter long. They have plump bodies and eight stubby legs tipped with tiny claws. Under a microscope they seem to lumber along like bears, which is how they got their nickname.","Water bears need a thin layer of water around their bodies to stay active. When their home dries out, something remarkable happens. A water bear pulls in its head and legs, loses most of the water in its body, and curls into a dry little ball called a tun. In this state, its body slows down so much that it seems lifeless.","A water bear can stay in its tun for years. When water returns, it soaks it up, uncurls, and begins crawling again, sometimes within hours. Scientists have tested tuns in extreme conditions, including freezing cold and the airless emptiness of outer space. In one experiment, some water bears survived a trip on the outside of a spacecraft and returned to Earth alive.","Researchers hope that studying water bears could one day help people protect medicines that are damaged when they dry out or get too warm. That is not bad for a creature you might find in your own backyard."]},{"title":"Mary Anning, Fossil Hunter","genre":"History / Biography","poem":false,"paragraphs":["Mary Anning was born in 1799 in Lyme Regis, a small town on the southern coast of England. The cliffs near her home were full of fossils, the stony remains of plants and animals that lived long ago. Mary’s family was poor, and her father taught her to search the beaches for fossils they could sell to visitors.","Hunting fossils was risky work. The best finds appeared after storms, when chunks of cliff crashed onto the beach. Mary had to dig quickly before the tide carried the rocks away, and she had to watch for landslides above her.","When Mary was about twelve, she and her brother Joseph uncovered the skeleton of a strange sea creature that looked like a mix of a fish and a lizard. It was later named an ichthyosaur. Over the years Mary found many more important fossils, including the first nearly complete skeleton of a long-necked sea reptile called a plesiosaur.","Even though scientists traveled from far away to learn from her, Mary was not allowed to join the leading science society in London because she was a woman. Her name was often left out of reports about the fossils she discovered. Today, however, she is honored as one of the most important fossil hunters in history. Her discoveries helped people understand that some kinds of animals had lived long ago and then disappeared."]},{"title":"Morning Fog","genre":"Poetry","poem":true,"paragraphs":["The playground disappeared at dawn;\na blanket, damp and gray,\nwas tucked around the swings and slide\nand hid the field away.","The streetlights glowed like sleepy eyes\nhalf-open in the mist;\nthe flagpole was a silver thread\nthat something soft had kissed.","I called my dog. I heard him bark\nbut could not see him there—\na jingle, then a happy nose\ncame bounding through the air.","By ten o’clock the sun broke through\nand rolled the fog away,\nlike someone lifting up a sheet\nto show a brand-new day."]}],"reading":[{"passage":0,"cat":"Supporting Details","text":"What was Tomás’s role in the class play?","explanation":"Paragraph 1 says he was the narrator, who tells the audience what is happening.","evidence":{"para":0,"text":"He was the narrator"},"choices":["The narrator","The king","The stage manager","A singer in the chorus"],"answer":0,"n":1},{"passage":0,"cat":"Supporting Details","text":"Where did Tomás practice his lines at home?","explanation":"The passage says, “At home in front of the mirror, his voice sounded strong and clear.”","evidence":{"para":0,"text":"At home in front of the mirror"},"choices":["In the backyard","In front of the mirror","At a friend’s house","In the school auditorium"],"answer":1,"n":2},{"passage":0,"cat":"Tone & Figurative Language","text":"The author writes that the faces “seemed to stretch forever.” This shows that Tomás —","explanation":"The room did not really grow. Saying the faces stretched forever shows how huge and scary the crowd felt to him.","evidence":{"para":1,"text":"rows of faces that seemed to stretch forever"},"choices":["could not see because the lights were off","thought the room was getting longer","felt overwhelmed by how big the audience seemed","was excited to meet everyone"],"answer":2,"n":3},{"passage":0,"cat":"Inference","text":"Why did Lucía wave the cardboard star?","explanation":"She made the star for him and waved it when he froze. Seeing her helped him remember practicing and start again.","evidence":{"para":2,"text":"waving it like a flag"},"choices":["To tell him the play was over","To ask him to come sit with her","To show the audience her art project","To encourage her brother and remind him she was there"],"answer":3,"n":4},{"passage":0,"cat":"Vocabulary in Context","text":"In paragraph 2, the word packed means —","explanation":"Tomás sees rows and rows of faces, so the auditorium was full of people.","evidence":{"para":1,"text":"the auditorium was packed"},"choices":["very full of people","wrapped in boxes","dark and empty","loud with music"],"answer":0,"n":5},{"passage":0,"cat":"Inference","text":"What does Mrs. Adeyemi mean when she says, “You got stuck, and then you got unstuck”?","explanation":"He froze (got stuck) but then started his lines (got unstuck). She says that is the hardest part.","evidence":{"para":3,"text":"You got stuck, and then you got unstuck."},"choices":["Tomás’s costume got caught on the stage.","Tomás recovered after freezing, which took courage.","Tomás forgot to bow at the end.","Tomás should not be in next year’s play."],"answer":1,"n":6},{"passage":0,"cat":"Main Idea","text":"Which sentence best tells the theme of the story?","explanation":"Seeing his sister’s support helped Tomás get past his stage fright.","evidence":{"para":2,"text":"Then he spotted Lucía in the third row."},"choices":["Practicing is a waste of time.","Plays are only fun for the audience.","Support from others can help you push through a scary moment.","It is better to have a small part than a big one."],"answer":2,"n":7},{"passage":1,"cat":"Supporting Details","text":"Where does the passage say you might find a water bear?","explanation":"The first sentence says to look in a clump of damp moss.","evidence":{"para":0,"text":"a clump of damp moss"},"choices":["Inside a bear’s den","Only in deep caves","On the surface of the Sun","In a clump of damp moss"],"answer":3,"n":8},{"passage":1,"cat":"Vocabulary in Context","text":"In paragraph 1, the word lumber means —","explanation":"Bears walk in a slow, heavy way. Here lumber is a verb describing that kind of walk, not wood.","evidence":{"para":0,"text":"lumber along like bears"},"choices":["to move along in a slow, heavy way","to cut down trees","to jump very high","to swim quickly"],"answer":0,"n":9},{"passage":1,"cat":"Supporting Details","text":"How did water bears get their nickname?","explanation":"Paragraph 1 says they lumber along like bears, “which is how they got their nickname.”","evidence":{"para":0,"text":"which is how they got their nickname"},"choices":["They live near bears.","They seem to walk like bears under a microscope.","They are as big as bear cubs.","They eat honey."],"answer":1,"n":10},{"passage":1,"cat":"Supporting Details","text":"What does a water bear do when its home dries out?","explanation":"Paragraph 2 explains that it pulls in its legs and curls into a tun.","evidence":{"para":1,"text":"curls into a dry little ball called a tun"},"choices":["It swims to the ocean.","It builds a nest of moss.","It curls into a dry ball called a tun.","It grows a hard shell."],"answer":2,"n":11},{"passage":1,"cat":"Inference","text":"Why did scientists most likely send water bears into outer space?","explanation":"The passage says scientists tested tuns in extreme conditions, including space, to see how tough they are.","evidence":{"para":2,"text":"Scientists have tested tuns in extreme conditions"},"choices":["To find out if water bears could fly","To give the astronauts pets","To look for water bears on the Moon","To test whether they could survive extremely harsh conditions"],"answer":3,"n":12},{"passage":1,"cat":"Organization & Logic","text":"How is paragraph 2 mainly organized?","explanation":"Problem: the home dries out. Response: the water bear curls into a tun.","evidence":{"para":1,"text":"When their home dries out, something remarkable happens."},"choices":["It describes a problem and how the water bear responds to it.","It compares water bears with real bears.","It lists facts in alphabetical order.","It gives the author’s opinion with no facts."],"answer":0,"n":13},{"passage":1,"cat":"Main Idea","text":"Which sentence tells the most important idea of the passage?","explanation":"The whole passage explains how water bears survive drying out, freezing, and even space.","evidence":{"para":0,"text":"you might find one of the toughest animals on Earth"},"choices":["Moss is the most important plant on Earth.","Water bears are tiny animals that can survive amazing hardships.","Microscopes were invented to study bears.","Outer space is full of animals."],"answer":1,"n":14},
