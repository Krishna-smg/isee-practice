function histTable(rec){
  return `<div class="card"><h3>${esc(rec.name)} — score history</h3><table class="hist"><tr><th>Date</th><th>Test</th><th>Mode</th><th>Reading</th><th>Math</th><th>Total</th></tr>
  ${rec.attempts.slice().reverse().map(a=>`<tr><td>${new Date(a.date).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</td><td>${a.testId} (${a.level})</td><td>${a.practice?'Practice':'Timed'}</td><td>${a.reading}/28</td><td>${a.math}/28</td><td><b>${a.totalCorrect}/56</b> (${Math.round(a.totalCorrect/56*100)}%)</td></tr>`).join('')}</table></div>`;
}
// ---------- INTRO / SAMPLE ----------
function viewIntro(){
  const s = sec(), smp = SAMPLES[s.key], picked = UI.sample;
  const dirs = s.key==='reading'
    ? `<p>In this section you will read <b>passages</b> and answer <b>28 questions</b> about them. The passage is on the left; the question is on the right. You may look back at the passage as often as you like.</p>`
    : `<p>In this section you will answer <b>28 math questions</b>. Work each problem and choose the best answer. <b>No calculator.</b> Use scratch paper or the on-screen <b>Scratch Pad</b>.</p>`;
  return `<div class="page"><div class="card">
   <h2>Section ${S.secIdx+1}: ${s.name}</h2>
   <div class="muted">Practice Test ${S.testId} · ${esc(S.name)}</div>
   ${dirs}
   <p>You will have <b>${S.practice?'unlimited time (practice mode)':fmtMin(SEC_TIME)}</b>. The clock starts when you press <b>Begin</b>. Use <b>Next</b> and <b>Back</b> to move, <b>⚑ Flag</b> to mark a question, <b>✕</b> to cross out a choice, and <b>Questions</b> to jump around.</p>
   <h3>Try a sample question (not scored)</h3>
   <div class="sample">
     ${smp.passage?`<p style="font-style:italic">${esc(smp.passage)}</p>`:''}
     <div class="qtext">${esc(smp.q)}</div>
     ${smp.choices.map((c,i)=>`<div class="choice"><button class="pick ${picked===i?'sel':''}" onclick="UI.sample=${i};render()"><span class="letter">${L(i)}</span><span class="ctext">${esc(c)}</span></button></div>`).join('')}
     ${picked!=null?`<div class="fb" style="color:${picked===smp.a?'var(--green)':'var(--red)'}">${picked===smp.a?'Correct! ':'Not quite. '}The answer is ${L(smp.a)}. On the real test you will not be told if you are right.</div>`:''}
   </div>
   <div class="row" style="justify-content:center;margin-top:20px"><button class="btn big green" onclick="beginSection()">Begin ${s.name} ▶</button></div>
  </div></div>`;
}
function beginSection(){
  const s = sec(); s.start = Date.now(); s.end = s.start + SEC_TIME; S.cur = 0; S.phase='test'; UI.sample=null;
  UI.warned=false; saveRun(); startTick(); render();
}
// ---------- TEST ----------
function viewTest(){
  const s = sec(), list = qs(), q = list[S.cur], t = test();
  const isR = s.key==='reading';
  UI.lastPassage = isR ? q.passage : null;
  const passage = isR ? t.passages[q.passage] : null;
  const crossed = s.crossed[S.cur];
  const qhtml = `<div class="question">
     <div class="qnum">Question ${S.cur+1} of ${list.length}${s.flags[S.cur]?' <span style="color:var(--flag)">⚑ Flagged</span>':''}</div>
     <div class="qtext">${rich(q.text)}</div>
     ${q.choices.map((c,i)=>`<div class="choice ${crossed.includes(i)?'crossed':''}"><button class="pick ${s.answers[S.cur]===i?'sel':''}" onclick="choose(${i})" aria-label="Choice ${L(i)}"><span class="letter">${L(i)}</span><span class="ctext">${rich(c)}</span></button><button class="x" title="Cross out" onclick="crossOut(${i})" aria-label="Cross out ${L(i)}">✕</button></div>`).join('')}
   </div>`;
  const side = UI.pad ? `<div class="side"><div class="row" style="justify-content:space-between"><h4>Scratch Pad</h4><span><button class="btn sec small" onclick="clearPad()">Clear</button> <button class="btn sec small" onclick="UI.pad=false;render()">Close</button></span></div><canvas class="pad" id="pad"></canvas><div class="muted" style="font-size:14px;margin-top:4px">Draw with mouse, finger, or pencil. Not scored.</div></div>`
    : UI.notes ? `<div class="side"><div class="row" style="justify-content:space-between"><h4>Notes</h4><button class="btn sec small" onclick="UI.notes=false;render()">Close</button></div><textarea id="notes" placeholder="Type notes here. Not scored.">${esc(s.notes)}</textarea></div>` : '';
  const last = S.cur===list.length-1;
  return `<div class="topbar">
     <span class="timer" id="timer">--:--</span>
     <span class="secname">${s.name}</span><span class="qcount">· Test ${S.testId}</span>
     <span class="spacer"></span>
     <button class="tool ${s.flags[S.cur]?'flagon':''}" onclick="toggleFlag()">⚑ ${s.flags[S.cur]?'Flagged':'Flag'}</button>
     <button class="tool" onclick="zoom(-1)" title="Smaller text">A−</button><button class="tool" onclick="zoom(1)" title="Bigger text">A+</button>
     <button class="tool ${UI.notes?'on':''}" onclick="UI.notes=!UI.notes;UI.pad=false;render()">✎ Notes</button>
     ${!isR?`<button class="tool ${UI.pad?'on':''}" onclick="UI.pad=!UI.pad;UI.notes=false;render()">✏ Scratch Pad</button>`:''}
   </div>
   <div id="warnbar"></div>
   <div class="main ${isR?'split':'single'}">
     ${isR?`<div class="passage"><h3>${esc(passage.title)}</h3>${passage.paragraphs.map(p=>`<p>${rich(p)}</p>`).join('')}</div>`:''}
     ${qhtml}${side}
   </div>
   <div class="bottombar">
     <button class="btn sec" onclick="go(-1)" ${S.cur===0?'disabled':''}>◀ Back</button>
     <button class="btn sec" onclick="UI.nav=true;openNav()">▦ Questions</button>
     <span class="spacer"></span><span class="muted" style="font-size:16px">${s.answers.filter(a=>a!=null).length} of ${list.length} answered</span><span class="spacer"></span>
     ${last?`<button class="btn" onclick="toReview()">Review ▶</button>`:`<button class="btn" onclick="go(1)">Next ▶</button>`}
   </div>`;
}
function choose(i){ const s=sec(); s.answers[S.cur] = i; s.crossed[S.cur]=s.crossed[S.cur].filter(x=>x!==i); saveRun(); render(); }
function crossOut(i){ const c=sec().crossed[S.cur]; const k=c.indexOf(i); if(k>=0) c.splice(k,1); else { c.push(i); if(sec().answers[S.cur]===i) sec().answers[S.cur]=null; } saveRun(); render(); }
function toggleFlag(){ const s=sec(); s.flags[S.cur]=!s.flags[S.cur]; saveRun(); render(); }
function zoom(d){ S.zoom = Math.max(-2, Math.min(4, (S.zoom||0)+d)); saveRun(); render(); }
function go(d){ S.cur = Math.max(0, Math.min(qs().length-1, S.cur+d)); const qp=$('.question'); saveRun(); render(); const q2=$('.question'); if(q2) q2.scrollTop=0; }
function jump(i){ UI.confirm=null; S.cur=i; S.phase='test'; saveRun(); render(); }
function navGrid(){
  const s=sec();
  return `<div class="nav">${qs().map((_,i)=>`<button class="${s.answers[i]!=null?'ans':''} ${s.flags[i]?'flg':''} ${i===S.cur&&S.phase==='test'?'cur':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>
  <div class="legend"><span class="l-ans">Answered</span><span>Not answered</span><span style="color:var(--flag)">⚑ Flagged</span></div>`;
}
function openNav(){ UI.confirm = `<div class="overlay noprint" onclick="if(event.target===this){UI.confirm=null;render()}"><div class="modal"><h2>Questions — ${sec().name}</h2>${navGrid()}<div class="row" style="justify-content:flex-end"><button class="btn sec" onclick="UI.confirm=null;render()">Close</button><button class="btn" onclick="UI.confirm=null;toReview()">Go to Review</button></div></div></div>`; render(); }
function toReview(){ S.phase='review'; UI.pad=false; saveRun(); render(); }
// ---------- REVIEW ----------
function viewReview(){
  const s=sec(), n=qs().length;
  const un = s.answers.map((a,i)=>a==null?i:-1).filter(i=>i>=0), fl = s.flags.map((f,i)=>f?i:-1).filter(i=>i>=0);
  const timeLeft = S.practice ? Infinity : s.end - Date.now();
  const canFinish = S.allowEarly || timeLeft<=0;
  return `<div class="topbar"><span class="timer" id="timer">--:--</span><span class="secname">${s.name} — Review</span></div><div id="warnbar"></div>
  <div class="page"><div class="card">
    <h2>Review: ${s.name}</h2>
    <p><b>${n-un.length}</b> of ${n} answered · <span class="st un">${un.length} not answered</span> · <span class="st fl">${fl.length} flagged</span></p>
    <p class="muted">Tap any question to go back to it. ${canFinish?'':'On the real test you must stay in this section until time runs out — use the extra time to check your answers!'}</p>
    <div class="review-list">${qs().map((q,i)=>`<button onclick="jump(${i})"><b>Question ${i+1}</b>${s.flags[i]?' ⚑':''}<span class="st ${s.answers[i]==null?'un':s.flags[i]?'fl':'ok'}">${s.answers[i]==null?'Not answered':'Answered '+L(s.answers[i])}${s.flags[i]?' · flagged':''}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:16px">
      <button class="btn sec" onclick="jump(${un[0]!=null?un[0]:(fl[0]!=null?fl[0]:0)})">◀ Back to questions</button>
      <button class="btn green big" id="finishBtn" onclick="confirmFinish()" ${canFinish?'':'disabled'}>Finish section</button>
    </div>
  </div></div>`;
}
function confirmFinish(){
  const s=sec(); const un=s.answers.filter(a=>a==null).length;
  UI.confirm = `<div class="overlay noprint"><div class="modal"><h2>Finish ${s.name}?</h2>${un?`<p class="st un">You have ${un} unanswered question${un>1?'s':''}. There is no penalty for guessing!</p>`:''}<p>After you finish, you <b>cannot come back</b> to this section.</p><div class="row" style="justify-content:flex-end"><button class="btn sec" onclick="UI.confirm=null;render()">Keep working</button><button class="btn green" id="confirmYes" onclick="UI.confirm=null;finishSection(false)">Yes, finish</button></div></div></div>`;
  render();
}
function finishSection(auto){
  const s=sec(); if(s.done) return;
  s.done=true; s.auto=auto; s.used = Math.min(Date.now()-s.start, S.practice?Infinity:SEC_TIME);
  UI.pad=false; UI.notes=false; UI.confirm=null;
  if(auto){ S.phase='timesup'; }
  else afterSection();
  saveRun(); render();
}
function afterSection(){
  if(S.secIdx < S.secs.length-1){ S.phase='break'; S.breakEnd = Date.now()+BREAK_TIME; }
  else finishRun();
}
function viewTimesUp(){
  const s=sec();
  return `<div class="page"><div class="card center"><h1>⏰ Time's up!</h1><p>The ${s.name} section has ended and your answers were saved. You answered ${s.answers.filter(a=>a!=null).length} of ${s.answers.length} questions.</p><button class="btn big" id="continueBtn" onclick="afterSection();saveRun();render()">Continue ▶</button></div></div>`;
}
// ---------- BREAK ----------
function viewBreak(){
  return `<div class="page"><div class="card center"><h1>Break time</h1>
  <p>Great job finishing ${S.secs[S.secIdx].name}! You may take a short break (optional). Stretch, get a drink of water, or have a snack.</p>
  <p class="muted">On the real test the break is optional and about 5–10 minutes. Ask your proctor before leaving the room.</p>
  <div class="bigclock" id="breakclock">${fmt(S.breakEnd-Date.now())}</div><p class="muted">Break time left</p>
  <button class="btn big green" id="resumeBtn" onclick="endBreak()">I'm ready — go to ${S.secs[S.secIdx+1].name} ▶</button></div></div>`;
}
function endBreak(){ S.secIdx++; S.phase='intro'; S.breakEnd=null; saveRun(); render(); window.scrollTo(0,0); }
// ---------- TIMER ----------
function startTick(){ if(tick) clearInterval(tick); tick = setInterval(onTick, 250); }
function onTick(){
  if(!S) return;
  if(S.phase==='test'||S.phase==='review'){
    const s=sec();
    if(!S.practice && Date.now()>=s.end){ finishSection(true); return; }
    updateTimer();
    if(S.phase==='review' && !S.allowEarly){ const b=$('#finishBtn'); if(b && b.disabled && Date.now()>=s.end) render(); }
  } else if(S.phase==='break'){
    const left = S.breakEnd-Date.now(); const c=$('#breakclock'); if(c) c.textContent=fmt(left);
    if(left<=0) endBreak();
  }
}
function updateTimer(){
  const el=$('#timer'); if(!el||!S||!S.secs) return;
  const s=sec(); if(!s.start) return;
  if(S.practice){ el.textContent = '⏱ '+fmt(Date.now()-s.start); el.title='Practice mode: time used'; return; }
  const left = s.end-Date.now();
  el.textContent = '⏱ '+fmt(left);
  el.className = 'timer' + (left<=60000?' crit':left<=WARN_AT?' warn':'');
  const wb=$('#warnbar');
  if(wb){ wb.innerHTML = left<=WARN_AT ? `<div class="warnbar">⚠ ${left<=60000?'Less than 1 minute':fmt(WARN_AT)==='10:00'?'10 minutes or less':'Not much time'} left in this section.</div>`:''; }
}
// ---------- SCRATCH PAD ----------
const PADS = {};
function initPad(){
  const c=$('#pad'); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1f2937';
  const key=S.testId+'-'+S.secIdx;
  if(PADS[key]){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=PADS[key]; }
  let drawing=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();};
  c.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();};
  c.onpointerup=c.onpointercancel=()=>{if(drawing){drawing=false;PADS[key]=c.toDataURL();}};
}
function clearPad(){ delete PADS[S.testId+'-'+S.secIdx]; const c=$('#pad'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height); }
// ---------- RESULTS ----------
function finishRun(){
  S.phase='results'; S.finishedAt=Date.now(); clearInterval(tick);
  const t=test();
  const sc = S.secs.map(s=>s.answers.reduce((n,a,i)=>n+(a===t[s.key][i].answer?1:0),0));
  S.scores = sc;
  const h=hist(), k=keyName(S.name);
  h[k] = h[k] || {name:S.name, attempts:[]};
  h[k].name = S.name;
  h[k].attempts.push({date:S.finishedAt, testId:S.testId, level:t.level, practice:S.practice, reading:sc[0], math:sc[1], totalCorrect:sc[0]+sc[1],
    usedSec:S.secs.map(s=>Math.round(s.used/1000)), missed:S.secs.map(s=>s.answers.map((a,i)=>a===t[s.key][i].answer?null:i+1).filter(x=>x))});
  saveHist(h); try{localStorage.removeItem(LS_RUN);}catch(e){}
  UI.resultShowAll = false;
}
function viewResults(){
  const t=test();
  const boxes = S.secs.map((s,si)=>{const n=s.answers.length, c=S.scores[si]; return `<div class="box"><div><b>${s.name}</b></div><div class="pct">${c}/${n}</div><div>${Math.round(c/n*100)}% correct</div><div class="muted" style="font-size:16px">Time used: ${fmtUsed(s.used)}${S.practice?'':' of '+fmtMin(SEC_TIME)}${s.auto?' (time ran out)':''}<br>Unanswered: ${s.answers.filter(a=>a==null).length}</div></div>`;}).join('');
  const total=S.scores[0]+S.scores[1];
  const missed = S.secs.map(s=>{
    const items = t[s.key].map((q,i)=>({q,i,a:s.answers[i]})).filter(x=>x.a!==x.q.answer);
    return `<h3>${s.name}: ${items.length?items.length+' to review':'perfect score! 🎉'}</h3>` + items.map(({q,i,a})=>`<div class="miss ${a==null?'unans':''}">
      <div><b>Q${i+1}.</b> ${s.key==='reading'?`<span class="muted">[${esc(t.passages[q.passage].title)}]</span> `:''}${rich(q.text)}</div>
      <div>Your answer: ${a==null?'<span class="bad">(not answered)</span>':`<span class="bad">${L(a)}. ${rich(q.choices[a])}</span>`}</div>
      <div>Correct answer: <span class="ok">${L(q.answer)}. ${rich(q.choices[q.answer])}</span></div>
      ${q.explanation?`<div class="muted">Why: ${rich(q.explanation)}</div>`:''}</div>`).join('');
  }).join('');
  const rec = hist()[keyName(S.name)];
  return `<div class="page">
   <div class="card"><h1>Results — ${esc(S.name)}</h1>
    <div class="muted">Practice Test ${S.testId} (${t.level}) · ${S.practice?'Practice mode (untimed)':'Timed mode'} · ${new Date(S.finishedAt).toLocaleString()}</div>
    <h2 style="margin-top:14px">Total: ${total}/56 (${Math.round(total/56*100)}%)</h2>
    <div class="score">${boxes}</div>
    <p class="muted" style="font-size:16px">Note: the real ISEE reports scaled scores, percentiles and stanines compared with other students applying to the same grade — not a percent correct. This practice score is just the number you got right.</p>
    <div class="row noprint"><button class="btn" onclick="window.print()">🖨 Print results</button><button class="btn sec" onclick="S=null;render();window.scrollTo(0,0)">Back to start</button></div>
   </div>
   <div class="card"><h2>Questions to review</h2>${missed}</div>
   ${rec?histTable(rec):''}
  </div>`;
}
// ---------- BOOT ----------
window.addEventListener('beforeunload', e=>{ if(S && (S.phase==='test'||S.phase==='review')){ saveRun(); } });
window.addEventListener('resize', ()=>{ if(UI.pad && S && S.phase==='test') initPad(); });
document.addEventListener('keydown', e=>{
  if(!S || S.phase!=='test' || UI.confirm || (e.target && /TEXTAREA|INPUT/.test(e.target.tagName))) return;
  if(e.key==='ArrowRight'){ if(S.cur<qs().length-1) go(1); }
  else if(e.key==='ArrowLeft') go(-1);
  else if(/^[a-dA-D]$/.test(e.key)) choose('abcd'.indexOf(e.key.toLowerCase()));
});
render();
</script>
</body>
</html>
