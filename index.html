<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISEE Primary 4 Practice Simulator (Unofficial)</title>
<style>
:root{--blue:#1d4e89;--blue2:#2f6fb8;--light:#eef4fb;--ink:#1f2937;--muted:#5b6575;--green:#1f7a4d;--red:#b42318;--amber:#b45309;--flag:#e8590c;--border:#cfd8e3;--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f5f7fa;font-size:var(--fs);line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#app{min-height:100vh;display:flex;flex-direction:column}
#app.fixed{height:100vh;height:100dvh;overflow:hidden}
.disc{background:#fff7e6;color:#8a4b00;text-align:center;font-size:14px;padding:4px 8px;border-bottom:1px solid #f1d7a8}
.disc-foot{border-top:1px solid #f1d7a8;border-bottom:none;margin-top:auto}
.page{max-width:980px;margin:0 auto;padding:24px 28px;width:100%}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{color:var(--blue);font-size:32px;margin:6px 0 4px}
h2{color:var(--blue);font-size:26px;margin:0 0 12px}
h3{color:var(--blue);font-size:21px;margin:14px 0 8px}
.muted{color:var(--muted)}
.btn{background:var(--blue2);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:600;min-height:48px}
.btn:hover{background:var(--blue)}
.btn:disabled{background:#9aa9bb;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--blue2)}
.btn.big{font-size:22px;padding:14px 34px}
.btn.green{background:var(--green)}
.btn.small{padding:6px 14px;min-height:40px;font-size:17px}
input[type=text]{font:inherit;padding:10px 14px;border:2px solid var(--border);border-radius:10px;width:100%;max-width:420px}
.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:10px 0}
.tpick{border:3px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff;text-align:left}
.tpick.sel{border-color:var(--blue2);background:var(--light)}
.tpick b{font-size:22px;color:var(--blue)}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle}
.tag.std{background:#dcfce7;color:#166534}.tag.hard{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
table.fmt{border-collapse:collapse;width:100%;font-size:18px}
table.fmt td,table.fmt th{border:1px solid var(--border);padding:8px 12px;text-align:left}
table.fmt th{background:var(--light)}
ul.ins li{margin-bottom:6px}
label.opt{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:18px}
label.opt input{width:22px;height:22px;margin-top:3px}
/* test layout */
.topbar{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;padding:8px 14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px;background:rgba(255,255,255,.15);padding:4px 14px;border-radius:8px;min-width:118px;text-align:center}
.timer.warn{background:#fbbf24;color:#3b2500}
.timer.crit{background:#ef4444;color:#fff}
.secname{font-weight:700;font-size:20px}
.qcount{font-size:18px;opacity:.9}
.spacer{flex:1}
.tool{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;font-size:17px;min-height:42px}
.tool.on{background:#fff;color:var(--blue)}
.tool.flagon{background:var(--flag);border-color:var(--flag)}
.warnbar{background:#fef3c7;color:#7c2d12;text-align:center;padding:6px;font-weight:600;font-size:18px}
.main{flex:1;display:flex;min-height:0;overflow:hidden}
.passage{flex:1 1 50%;overflow-y:auto;padding:20px 26px;background:#fff;border-right:2px solid var(--border);-webkit-overflow-scrolling:touch}
.passage h3{margin-top:0}
.passage p{margin:0 0 14px;text-indent:1.4em}
.question{flex:1 1 50%;overflow-y:auto;padding:22px 28px;-webkit-overflow-scrolling:touch}
.single .question{max-width:900px;margin:0 auto}
.qnum{font-weight:800;color:var(--blue);font-size:18px;margin-bottom:6px}
.qtext{font-size:1.1em;font-weight:600;margin-bottom:16px}
.choice{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.choice .pick{flex:1;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px 16px;min-height:58px;color:var(--ink)}
.choice .pick:hover{border-color:var(--blue2)}
.choice .pick.sel{border-color:var(--blue2);background:var(--light);box-shadow:0 0 0 2px var(--blue2) inset}
.choice .letter{flex:0 0 38px;height:38px;border-radius:50%;border:2px solid var(--blue2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue2)}
.choice .pick.sel .letter{background:var(--blue2);color:#fff}
.choice.crossed .ctext{text-decoration:line-through;color:#9aa3ad}
.choice .x{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:#fff;color:var(--muted);font-weight:800}
.choice.crossed .x{background:#fde2e2;border-color:#f3a5a5;color:var(--red)}
.bottombar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#e6edf5;border-top:1px solid var(--border)}
.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:520px}
.nav button{position:relative;height:50px;border-radius:8px;border:2px solid var(--border);background:#fff;font-weight:700;color:var(--ink)}
.nav button.ans{background:#d7e7f8;border-color:var(--blue2)}
.nav button.cur{outline:3px solid var(--blue);outline-offset:1px}
.nav button.flg::after{content:"⚑";position:absolute;top:-2px;right:3px;color:var(--flag);font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:20px 24px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.legend{display:flex;gap:16px;font-size:15px;margin:10px 0;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid var(--border);vertical-align:-3px;margin-right:6px}
.legend .l-ans::before{background:#d7e7f8;border-color:var(--blue2)}
.side{flex:0 0 360px;border-left:2px solid var(--border);background:#fffdf6;display:flex;flex-direction:column;padding:10px}
.side h4{margin:4px 0 8px;color:var(--blue)}
.side textarea{flex:1;font:inherit;font-size:18px;border:1px solid var(--border);border-radius:8px;padding:8px;resize:none}
canvas.pad{background:#fff;border:1px solid var(--border);border-radius:8px;touch-action:none;width:100%;flex:1;min-height:200px}
.review-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.review-list button{text-align:left;border:2px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;font-size:17px}
.review-list .st{font-size:14px;display:block}
.st.un{color:var(--red);font-weight:700}.st.fl{color:var(--flag);font-weight:700}.st.ok{color:var(--green)}
.center{text-align:center}
.bigclock{font-size:64px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.score .box{border:2px solid var(--border);border-radius:12px;padding:14px 18px;background:#fff}
.score .pct{font-size:40px;font-weight:800;color:var(--blue)}
.miss{border-left:5px solid var(--red);background:#fff;padding:10px 14px;margin-bottom:10px;border-radius:6px;font-size:18px;break-inside:avoid}
.miss.unans{border-left-color:var(--amber)}
.miss .ok{color:var(--green);font-weight:700}.miss .bad{color:var(--red);font-weight:700}
table.hist{border-collapse:collapse;width:100%;font-size:17px}
table.hist td,table.hist th{border:1px solid var(--border);padding:6px 10px;text-align:left}
table.hist th{background:var(--light)}
.essay{width:100%;min-height:200px;font:inherit}
.sample{border:2px dashed var(--blue2);border-radius:12px;padding:14px 18px;background:#fbfdff}
.fb{margin-top:8px;font-weight:700}
@media (max-width:900px){.side{flex-basis:290px}}
@media (max-width:820px) and (orientation:portrait){.main.split{flex-direction:column}.passage{border-right:none;border-bottom:2px solid var(--border);flex-basis:45%}.side{position:fixed;right:0;top:0;bottom:0;width:85%;z-index:40;box-shadow:-4px 0 18px rgba(0,0,0,.2)}.tests{grid-template-columns:1fr}}
@media print{.noprint,.topbar,.bottombar{display:none!important}body{background:#fff;font-size:14px}.card{border:none;box-shadow:none;padding:6px 0}.page{padding:0}.disc{background:none}.miss{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Please enable JavaScript to use this practice simulator.</noscript>
<script>
const TESTS = [{"id": 1, "level": "Standard", "passages": [{"title": "Passage 1 — The Seed Map (Fiction)", "paragraphs": ["Maya kept a small notebook she called her Seed Map. Each time she planted something in the garden behind her apartment, she drew a tiny picture and wrote the date. On Monday she planted peas. On Tuesday she planted carrots. On Wednesday the sky opened and rain poured for hours.", "Maya worried the seeds would wash away. Her neighbor, Mr. Ortiz, leaned over the fence. “Strong seeds hold on,” he said. “Give them a chance.” Maya checked every morning. On Friday she saw pale green loops poking through the soil where the peas had been. She circled the page in her Seed Map and wrote, “They stayed!”", "That weekend Maya invited her little brother Leo to help water. Leo wanted to dig everything up to “see if the carrots were awake.” Maya gently stopped him. “They need quiet time underground,” she explained. Leo nodded and held the watering can with both hands instead. By the end of the month, the Seed Map was full of drawings—and the garden smelled like wet earth and new leaves."]}, {"title": "Passage 2 — How Beavers Build (Nonfiction)", "paragraphs": ["Beavers are busy builders. Using their strong teeth, they cut down small trees and branches. They drag the wood to a stream and pile it with mud, stones, and plants. The pile becomes a dam that slows the water and makes a calm pond.", "In the pond, beavers build a lodge—a cozy home with an underwater entrance. The lodge keeps beavers safe from many predators. Inside, the family rests on a dry platform above the water.", "Beaver ponds help other animals too. Fish, frogs, birds, and insects find food and shelter in the still water. When beavers leave an area, their dams may slowly break down, and the land can turn into a wet meadow full of wildflowers.", "Scientists study beaver dams because they can reduce flooding downstream and create rich habitats. Next time you see a quiet pond in the woods, look carefully—busy builders may have been at work."]}, {"title": "Passage 3 — Bus Stop Mystery (Fiction)", "paragraphs": ["Every morning, Jamal waited at the corner bus stop with his backpack and his lunch bag. One Tuesday he noticed a bright blue mitten hanging from the bench. On Wednesday a matching mitten appeared on the other side. On Thursday both mittens were gone—and a thank-you note was taped to the bench: “Thanks for keeping them safe. —A.R.”", "Jamal frowned. He had not touched the mittens. Who had “kept them safe”? He asked Ms. Patel, who walked her dog past the stop each day. She smiled. “I saw you glance at them but leave them alone. That was kind. I moved them under the bench so the rain wouldn’t soak them, then the owner found them.”", "Jamal felt warm inside. Being careful with someone else’s things had mattered—even if he hadn’t known it. That Friday he found a tiny paper crane folded on the bench. Inside was written, “For the careful kid at the stop.” Jamal grinned and carefully tucked the crane into his notebook."]}, {"title": "Passage 4 — Measuring the Wind (Nonfiction)", "paragraphs": ["Wind is moving air, but how do we measure it? Long ago, people watched flags, smoke, and tree branches to guess how hard the wind blew. Today, scientists use tools called anemometers. Many anemometers have cups that spin when the wind pushes them. The faster the cups spin, the stronger the wind.", "Wind speed is often reported in miles per hour. A gentle breeze might blow at 5 to 10 miles per hour. A strong wind can top 30 miles per hour and make walking feel hard. Weather reporters also describe wind direction—where the wind comes from—using words like north, south, east, and west.", "Knowing wind speed and direction helps pilots, sailors, and farmers. It also helps communities prepare for storms. Even kids can observe wind: watch a pinwheel, feel your hair move, or notice which way clouds travel across the sky."]}], "reading": [{"n": 1, "passage": 0, "text": "What does Maya call her notebook?", "choices": ["The Seed Map", "The Plant Book", "The Rain Journal", "The Garden Diary"], "answer": 0, "explanation": "She calls her notebook the Seed Map."}, {"n": 2, "passage": 0, "text": "What did Maya plant on Tuesday?", "choices": ["Carrots", "Beans", "Peas", "Lettuce"], "answer": 0, "explanation": "The passage says she planted carrots on Tuesday."}, {"n": 3, "passage": 0, "text": "Why was Maya worried after Wednesday’s rain?", "choices": ["She lost her notebook.", "She thought the seeds might wash away.", "Leo ate the seeds.", "Mr. Ortiz was angry."], "answer": 1, "explanation": "She worried the rain would wash the seeds away."}, {"n": 4, "passage": 0, "text": "What does Mr. Ortiz mean when he says, “Strong seeds hold on”?", "choices": ["Seeds only grow on Mondays.", "Seeds can climb fences.", "Seeds like to be watered every hour.", "Healthy seeds can survive tough weather."], "answer": 3, "explanation": "He means healthy seeds can survive tough weather."}, {"n": 5, "passage": 0, "text": "What did Maya see on Friday?", "choices": ["Leo’s watering can", "Pale green loops from the peas", "A new fence", "Carrots ready to eat"], "answer": 1, "explanation": "She saw pale green loops from the peas."}, {"n": 6, "passage": 0, "text": "Why did Maya stop Leo from digging?", "choices": ["It was raining again.", "She wanted to dig herself.", "Mr. Ortiz told her to.", "The carrots needed quiet time underground."], "answer": 3, "explanation": "She said carrots need quiet time underground."}, {"n": 7, "passage": 0, "text": "Which word best describes Maya in this story?", "choices": ["Patient", "Sleepy", "Angry", "Careless"], "answer": 0, "explanation": "She waits, checks carefully, and protects the garden—patient."}, {"n": 8, "passage": 1, "text": "What do beavers use to cut down trees?", "choices": ["Their strong teeth", "Their tails", "Sharp rocks", "Other animals’ help"], "answer": 0, "explanation": "Beavers cut trees with strong teeth."}, {"n": 9, "passage": 1, "text": "What is a dam’s main job in this passage?", "choices": ["To hold wildflowers", "To dry up the stream", "To slow the water and make a pond", "To scare fish away"], "answer": 2, "explanation": "A dam slows water and makes a pond."}, {"n": 10, "passage": 1, "text": "Where is the entrance to a beaver lodge?", "choices": ["On a hilltop", "Through a tree trunk", "Underwater", "On the roof"], "answer": 2, "explanation": "The lodge has an underwater entrance."}, {"n": 11, "passage": 1, "text": "According to the passage, beaver ponds help other animals by providing —", "choices": ["Warm fires", "Loud music", "Maps and tools", "Food and shelter"], "answer": 3, "explanation": "Ponds provide food and shelter."}, {"n": 12, "passage": 1, "text": "What may happen after beavers leave an area?", "choices": ["All fish disappear immediately.", "The pond turns to ice forever.", "Trees grow underwater.", "Dams may break down and the land becomes a wet meadow."], "answer": 3, "explanation": "Dams may break down into wet meadows."}, {"n": 13, "passage": 1, "text": "In the last paragraph, the word <i>habitats<\/i> most nearly means —", "choices": ["Names of scientists", "Types of dams", "Places where animals live", "Kinds of teeth"], "answer": 2, "explanation": "Habitats are places where animals live."}, {"n": 14, "passage": 1, "text": "What is the main idea of this passage?", "choices": ["Wildflowers scare beavers away.", "All ponds are made by people.", "Beavers build dams and lodges that help create pond habitats.", "Beavers only eat fish."], "answer": 2, "explanation": "Main idea: beavers build and create pond habitats."}, {"n": 15, "passage": 2, "text": "Where does Jamal wait each morning?", "choices": ["In Ms. Patel’s yard", "At the library", "At school", "At the corner bus stop"], "answer": 3, "explanation": "He waits at the corner bus stop."}, {"n": 16, "passage": 2, "text": "What did Jamal first notice on Tuesday?", "choices": ["Ms. Patel’s dog", "A thank-you note", "A paper crane", "A blue mitten on the bench"], "answer": 3, "explanation": "A bright blue mitten on the bench."}, {"n": 17, "passage": 2, "text": "Who wrote the thank-you note signed “A.R.”?", "choices": ["The bus driver", "The mittens’ owner", "Ms. Patel", "Jamal"], "answer": 1, "explanation": "A.R. is the mittens’ owner thanking someone."}, {"n": 18, "passage": 2, "text": "What did Ms. Patel do to help?", "choices": ["She took the mittens home forever.", "She called the police.", "She threw the mittens away.", "She moved the mittens under the bench out of the rain."], "answer": 3, "explanation": "She moved them under the bench out of the rain."}, {"n": 19, "passage": 2, "text": "How did Jamal feel after talking with Ms. Patel?", "choices": ["Bored", "Confused and scared", "Angry and tired", "Warm inside / glad his care mattered"], "answer": 3, "explanation": "He felt warm inside that his care mattered."}, {"n": 20, "passage": 2, "text": "The paper crane was most likely a —", "choices": ["Warning", "Bus ticket", "Homework assignment", "Gift of thanks"], "answer": 3, "explanation": "It was a gift of thanks for the careful kid."}, {"n": 21, "passage": 2, "text": "Which lesson fits this story best?", "choices": ["Mittens are always blue.", "Small careful actions can help others.", "Never wait for the bus.", "Notes are never important."], "answer": 1, "explanation": "Small careful actions can help others."}, {"n": 22, "passage": 3, "text": "What is wind?", "choices": ["Moving air", "Sunlight", "Frozen ground", "Falling rain"], "answer": 0, "explanation": "Wind is moving air."}, {"n": 23, "passage": 3, "text": "What do many anemometers use to measure wind?", "choices": ["Rain gauges", "Compasses only", "Cups that spin", "Thermometers"], "answer": 2, "explanation": "Many anemometers have cups that spin."}, {"n": 24, "passage": 3, "text": "If cups on an anemometer spin very fast, the wind is —", "choices": ["Frozen", "Weaker", "Stronger", "Gone"], "answer": 2, "explanation": "Faster spin means stronger wind."}, {"n": 25, "passage": 3, "text": "A gentle breeze might blow at about —", "choices": ["50 to 60 miles per hour", "100 miles per hour", "0 miles per hour always", "5 to 10 miles per hour"], "answer": 3, "explanation": "A gentle breeze is about 5–10 mph."}, {"n": 26, "passage": 3, "text": "Wind direction tells us —", "choices": ["The color of clouds", "Where the wind comes from", "How wet the air is", "The time of day"], "answer": 1, "explanation": "Direction is where the wind comes from."}, {"n": 27, "passage": 3, "text": "Who might use wind information, according to the passage?", "choices": ["Only painters", "Pilots, sailors, and farmers", "Only musicians", "Only chefs"], "answer": 1, "explanation": "Pilots, sailors, and farmers use wind info."}, {"n": 28, "passage": 3, "text": "What is the main purpose of this passage?", "choices": ["To list every cloud name", "To tell a story about a pinwheel", "To explain how wind is measured and why it matters", "To teach cooking"], "answer": 2, "explanation": "Purpose: explain measuring wind and why it matters."}], "math": [{"n": 1, "text": "What is the value of the digit 7 in 4,752?", "choices": ["7", "70", "700", "7,000"], "answer": 2, "explanation": "7 is in the hundreds place → 700."}, {"n": 2, "text": "Which number is three thousand sixty-five?", "choices": ["365", "3,065", "3,650", "30,065"], "answer": 1, "explanation": "3,065 = three thousand sixty-five."}, {"n": 3, "text": "Round 847 to the nearest ten.", "choices": ["800", "840", "850", "900"], "answer": 2, "explanation": "847 → ones digit 7 ≥ 5, so round up to 850."}, {"n": 4, "text": "456 + 278 = ?", "choices": ["624", "634", "724", "734"], "answer": 3, "explanation": "456 + 278 = 734."}, {"n": 5, "text": "903 − 467 = ?", "choices": ["426", "436", "446", "536"], "answer": 1, "explanation": "903 − 467 = 436."}, {"n": 6, "text": "24 × 6 = ?", "choices": ["124", "134", "144", "154"], "answer": 2, "explanation": "24 × 6 = 144."}, {"n": 7, "text": "A class has 28 students. They line up in 4 equal rows. How many students are in each row?", "choices": ["6", "7", "8", "9"], "answer": 1, "explanation": "28 ÷ 4 = 7."}, {"n": 8, "text": "Which fraction is equivalent to 1/2?", "choices": ["1/3", "2/6", "2/4", "3/5"], "answer": 2, "explanation": "2/4 = 1/2."}, {"n": 9, "text": "Compare: 3/8 □ 5/8. Which symbol belongs in the box?", "choices": [">", "=", "<", "×"], "answer": 2, "explanation": "3/8 is less than 5/8."}, {"n": 10, "text": "1/5 + 2/5 = ?", "choices": ["1/5", "3/10", "2/5", "3/5"], "answer": 3, "explanation": "1/5 + 2/5 = 3/5."}, {"n": 11, "text": "A rectangle is 8 cm long and 3 cm wide. What is its perimeter?", "choices": ["11 cm", "22 cm", "24 cm", "48 cm"], "answer": 1, "explanation": "Perimeter = 2(8+3) = 22 cm."}, {"n": 12, "text": "A square has sides of 5 inches. What is its area?", "choices": ["10 square inches", "15 square inches", "20 square inches", "25 square inches"], "answer": 3, "explanation": "Area = 5 × 5 = 25."}, {"n": 13, "text": "How many centimeters are in 2 meters?", "choices": ["12", "20", "200", "2,000"], "answer": 2, "explanation": "2 m = 200 cm."}, {"n": 14, "text": "A movie starts at 2:15 and ends at 3:05. How long is the movie?", "choices": ["40 minutes", "55 minutes", "50 minutes", "1 hour 5 minutes"], "answer": 2, "explanation": "From 2:15 to 3:05 is 50 minutes."}, {"n": 15, "text": "Sam has $1.00. He buys a pencil for 35¢ and an eraser for 20¢. How much money does he have left?", "choices": ["15¢", "45¢", "55¢", "65¢"], "answer": 1, "explanation": "35 + 20 = 55; 100 − 55 = 45¢."}, {"n": 16, "text": "Which number sentence is true?", "choices": ["8 × 1 = 8", "8 × 0 = 8", "8 − 8 = 8", "8 ÷ 8 = 8"], "answer": 0, "explanation": "Multiplying by 1 leaves a number unchanged."}, {"n": 17, "text": "Find the missing number: 9 × □ = 63", "choices": ["6", "7", "8", "9"], "answer": 1, "explanation": "9 × 7 = 63."}, {"n": 18, "text": "A pictograph shows each ★ = 2 books. If Mia has ★★★★, how many books does she have?", "choices": ["4", "6", "8", "10"], "answer": 2, "explanation": "4 stars × 2 books = 8."}, {"n": 19, "text": "A bar graph shows: Apples 12, Bananas 8, Oranges 15. How many more oranges than bananas?", "choices": ["3", "5", "7", "9"], "answer": 2, "explanation": "15 − 8 = 7."}, {"n": 20, "text": "Which is the best estimate for 198 + 203?", "choices": ["300", "400", "500", "600"], "answer": 1, "explanation": "200 + 200 = 400."}, {"n": 21, "text": "4,000 + 50 + 9 = ?", "choices": ["459", "4,059", "4,509", "45,009"], "answer": 1, "explanation": "4,000 + 50 + 9 = 4,059."}, {"n": 22, "text": "A ribbon is 36 inches long. How many feet is that? (12 inches = 1 foot)", "choices": ["2 feet", "3 feet", "4 feet", "6 feet"], "answer": 1, "explanation": "36 ÷ 12 = 3 feet."}, {"n": 23, "text": "Which fraction is greatest?", "choices": ["1/8", "1/6", "1/4", "1/2"], "answer": 3, "explanation": "1/2 is the greatest of the choices."}, {"n": 24, "text": "72 ÷ 8 = ?", "choices": ["7", "8", "9", "10"], "answer": 2, "explanation": "72 ÷ 8 = 9."}, {"n": 25, "text": "A triangle has sides 4 cm, 5 cm, and 6 cm. What is its perimeter?", "choices": ["10 cm", "15 cm", "20 cm", "120 cm"], "answer": 1, "explanation": "4 + 5 + 6 = 15 cm."}, {"n": 26, "text": "If n + 17 = 40, what is n?", "choices": ["23", "27", "33", "57"], "answer": 0, "explanation": "n = 40 − 17 = 23."}, {"n": 27, "text": "Which shows 3 hundreds, 0 tens, and 8 ones?", "choices": ["38", "308", "380", "3,008"], "answer": 1, "explanation": "3 hundreds + 0 tens + 8 ones = 308."}, {"n": 28, "text": "A bakery sold 145 muffins on Friday and 128 on Saturday. About how many muffins were sold in all? (Estimate by rounding each to the nearest ten.)", "choices": ["250", "270", "280", "300"], "answer": 2, "explanation": "150 + 130 = 280."}]}, {"id": 2, "level": "Standard", "passages": [{"title": "Passage 1 — Lila’s Listening Walk (Fiction)", "paragraphs": ["Lila’s grandmother gave her a challenge: take a listening walk and write down five sounds you usually ignore. Lila stepped onto the sidewalk with a pencil and a small pad. At first she only heard cars. Then she noticed the soft scrape of a skateboard two blocks away, the chatter of sparrows in a hedge, and the drip-drip of a leaky faucet near the alley.", "Near the park, a food cart’s sizzling pan made her stomach rumble. She wrote “sizzle” and smiled. On the way home she heard her own footsteps—left, right, left—and realized she had never paid attention to that rhythm before.", "At dinner she read her list aloud. Grandma clapped. “You found a hidden world,” she said. Lila taped the list to the fridge and planned another listening walk for Saturday—this time with her cousin Marco."]}, {"title": "Passage 2 — Coral Reefs at Risk (Nonfiction)", "paragraphs": ["Coral reefs are sometimes called “rainforests of the sea” because so many animals live among them. Tiny coral animals build hard skeletons that form colorful underwater cities. Fish hide in the branches, sea turtles glide by, and crabs scuttle across the reef floor.", "Reefs need clear, warm, sunlit water. When water becomes too warm for too long, corals can turn white—a problem called bleaching. Pollution and careless fishing can also harm reefs. People can help by reducing waste, supporting clean water, and learning about ocean life.", "Scientists and local communities work together to protect reefs. Some places create underwater parks where fishing and boat anchors are limited. Healthy reefs protect coastlines from big waves and support food and jobs for many families."]}, {"title": "Passage 3 — The Extra Library Book (Fiction)", "paragraphs": ["When Noah emptied his backpack on Friday, two library books tumbled out—but he was sure he had checked out only one. The extra book was titled <i>Rocket Racers<\/i>, and a bookmark with a silver star stuck out from chapter three.", "Noah’s sister Priya shrugged. “Maybe it stuck to your book at the shelf.” At the library on Saturday, Noah explained the mix-up to Mr. Kim at the desk. Mr. Kim scanned the book. “It belongs to Ana Ruiz. She’ll be glad you brought it back. Want to leave a note?”", "Noah wrote: “Found this in my bag by mistake—hope you enjoy chapter three! —Noah.” The next week Ana waved at him in the hallway. “Thanks! The star bookmark is my reading luck charm.” Noah decided that returning something that isn’t yours can turn a mistake into a new friend."]}, {"title": "Passage 4 — From Orchard to Juice (Nonfiction)", "paragraphs": ["Have you ever wondered how apple juice gets from a tree to your glass? It begins in an orchard, where rows of apple trees grow. In autumn, workers pick ripe apples and place them carefully into bins so they do not bruise.", "At a juice facility, apples are washed, sorted, and crushed. The crushed fruit is pressed to squeeze out the liquid. Then the juice may be filtered to remove pulp. Many companies heat the juice (pasteurize it) to make it safer to store. Finally, juice is poured into bottles or cartons and shipped to stores.", "Some families make small batches at home with a hand press. Homemade juice often tastes fresh and may look cloudier because more pulp remains. Whether from a store or a kitchen, apple juice starts with sunlight, water, soil—and a whole lot of apples."]}], "reading": [{"n": 1, "passage": 0, "text": "What challenge did Lila’s grandmother give her?", "choices": ["Take a listening walk and write five sounds", "Run five miles", "Bake five cookies", "Draw five cars"], "answer": 0, "explanation": "Write five usually ignored sounds on a listening walk."}, {"n": 2, "passage": 0, "text": "What did Lila notice after the cars?", "choices": ["Only silence", "A marching band", "Thunder", "A skateboard, sparrows, and a leaky faucet"], "answer": 3, "explanation": "Skateboard, sparrows, and leaky faucet."}, {"n": 3, "passage": 0, "text": "Why did Lila write “sizzle”?", "choices": ["It was raining.", "She heard a food cart’s pan.", "Marco told her to.", "She burned toast."], "answer": 1, "explanation": "The food cart’s sizzling pan."}, {"n": 4, "passage": 0, "text": "What new sound did Lila notice on the way home?", "choices": ["Her own footsteps", "Airplane engines", "A doorbell", "A radio"], "answer": 0, "explanation": "She heard her own footsteps."}, {"n": 5, "passage": 0, "text": "What does Grandma mean by “You found a hidden world”?", "choices": ["Lila invented a new language.", "Lila got lost in the park.", "Lila discovered buried treasure.", "Lila noticed everyday sounds she usually ignored."], "answer": 3, "explanation": "Everyday sounds she usually ignored."}, {"n": 6, "passage": 0, "text": "What will Lila do on Saturday?", "choices": ["Take another listening walk with Marco", "Throw away her list", "Stay indoors all day", "Fix the faucet alone"], "answer": 0, "explanation": "Another listening walk with Marco."}, {"n": 7, "passage": 0, "text": "Which word best describes Lila during the walk?", "choices": ["Careless", "Angry", "Sleepy", "Observant"], "answer": 3, "explanation": "She carefully notices many sounds—observant."}, {"n": 8, "passage": 1, "text": "Why are coral reefs called “rainforests of the sea”?", "choices": ["They produce rain.", "Many animals live among them.", "They have trees underwater.", "They are always cold."], "answer": 1, "explanation": "Many animals live among them."}, {"n": 9, "passage": 1, "text": "What do tiny coral animals build?", "choices": ["Hard skeletons that form reefs", "Sandcastles on beaches", "Clouds", "Boats"], "answer": 0, "explanation": "Hard skeletons that form reefs."}, {"n": 10, "passage": 1, "text": "What is coral bleaching connected to in this passage?", "choices": ["Extra sunlight at night", "Faster waves only", "Too many turtles", "Water that is too warm for too long"], "answer": 3, "explanation": "Water too warm too long causes bleaching."}, {"n": 11, "passage": 1, "text": "Which is one way people can help reefs?", "choices": ["Ignoring ocean news", "Breaking coral for souvenirs", "Reducing waste and supporting clean water", "Dumping trash in the ocean"], "answer": 2, "explanation": "Reduce waste and support clean water."}, {"n": 12, "passage": 1, "text": "Why do some places create underwater parks?", "choices": ["To sell more boats", "To remove all fish", "To make water colder", "To limit fishing and boat anchors and protect reefs"], "answer": 3, "explanation": "Limit fishing/anchors to protect reefs."}, {"n": 13, "passage": 1, "text": "In the passage, the word <i>coastlines<\/i> refers to —", "choices": ["Desert roads", "School hallways", "Mountain tops", "Edges of land along the sea"], "answer": 3, "explanation": "Coastlines are edges of land along the sea."}, {"n": 14, "passage": 1, "text": "What is the main idea of this passage?", "choices": ["Parks are only on land.", "Bleaching is helpful.", "Coral reefs support many animals and need protection.", "All fish live in rivers."], "answer": 2, "explanation": "Reefs support life and need protection."}, {"n": 15, "passage": 2, "text": "How many library books did Noah expect to find?", "choices": ["Two", "Three", "One", "None"], "answer": 2, "explanation": "He was sure he checked out only one."}, {"n": 16, "passage": 2, "text": "What was the title of the extra book?", "choices": ["Chapter Three", "Rocket Racers", "Silver Star", "Library Luck"], "answer": 1, "explanation": "Rocket Racers."}, {"n": 17, "passage": 2, "text": "Whose book was the extra one?", "choices": ["Mr. Kim’s", "Noah’s teacher’s", "Priya’s", "Ana Ruiz’s"], "answer": 3, "explanation": "Mr. Kim said it belongs to Ana Ruiz."}, {"n": 18, "passage": 2, "text": "What did Noah do at the library?", "choices": ["Bought the book", "Tore out chapter three", "Hid the book", "Explained the mix-up and returned the book"], "answer": 3, "explanation": "He explained and returned it."}, {"n": 19, "passage": 2, "text": "Why was the silver star bookmark important to Ana?", "choices": ["It was made of real silver money.", "Mr. Kim required it.", "It opened the library doors.", "It was her reading luck charm."], "answer": 3, "explanation": "It was her reading luck charm."}, {"n": 20, "passage": 2, "text": "What did Noah learn?", "choices": ["Returning something that isn’t yours can create friendship.", "Bookmarks are useless.", "Sisters always cause mix-ups.", "Never visit libraries."], "answer": 0, "explanation": "Honesty can turn a mistake into friendship."}, {"n": 21, "passage": 2, "text": "Which detail shows Ana appreciated Noah’s honesty?", "choices": ["She waved and thanked him.", "She took his backpack.", "She closed the library.", "She ignored him."], "answer": 0, "explanation": "She waved and thanked him."}, {"n": 22, "passage": 3, "text": "Where does apple juice production begin?", "choices": ["In a shoe store", "In a school cafeteria", "In an orchard", "On a boat"], "answer": 2, "explanation": "It begins in an orchard."}, {"n": 23, "passage": 3, "text": "Why do workers place apples carefully into bins?", "choices": ["To paint them", "So they do not bruise", "To help them bruise", "To water them"], "answer": 1, "explanation": "So apples do not bruise."}, {"n": 24, "passage": 3, "text": "What happens when crushed apples are pressed?", "choices": ["Bins disappear", "Liquid is squeezed out", "Apples become trees again", "Seeds turn to juice instantly"], "answer": 1, "explanation": "Pressing squeezes out the liquid."}, {"n": 25, "passage": 3, "text": "Why do many companies pasteurize juice?", "choices": ["To freeze the bottles", "To add more pulp", "To change its color only", "To make it safer to store"], "answer": 3, "explanation": "Pasteurizing makes juice safer to store."}, {"n": 26, "passage": 3, "text": "How may homemade juice differ from store juice, according to the passage?", "choices": ["It is always poisonous.", "It may look cloudier with more pulp.", "It comes from oranges.", "It never tastes fresh."], "answer": 1, "explanation": "Homemade may be cloudier with more pulp."}, {"n": 27, "passage": 3, "text": "In the passage, <i>filtered<\/i> most nearly means —", "choices": ["Frozen solid", "Passed through something to remove bits", "Colored with paint", "Sung aloud"], "answer": 1, "explanation": "Filtered = passed through to remove bits."}, {"n": 28, "passage": 3, "text": "What is the main purpose of this passage?", "choices": ["To teach how to climb trees", "To describe steps in making apple juice", "To tell a fairy tale about juice", "To list every apple type in the world"], "answer": 1, "explanation": "Describes steps in making apple juice."}], "math": [{"n": 1, "text": "What is the value of the digit 5 in 5,308?", "choices": ["5", "50", "500", "5,000"], "answer": 3, "explanation": "5 is in the thousands place → 5,000."}, {"n": 2, "text": "Which number is five thousand two hundred seventeen?", "choices": ["517", "5,217", "5,271", "52,017"], "answer": 1, "explanation": "5,217."}, {"n": 3, "text": "Round 364 to the nearest hundred.", "choices": ["300", "350", "360", "400"], "answer": 3, "explanation": "364 rounds to 400."}, {"n": 4, "text": "629 + 185 = ?", "choices": ["704", "714", "804", "814"], "answer": 3, "explanation": "629 + 185 = 814."}, {"n": 5, "text": "700 − 358 = ?", "choices": ["342", "348", "352", "442"], "answer": 0, "explanation": "700 − 358 = 342."}, {"n": 6, "text": "35 × 4 = ?", "choices": ["120", "130", "140", "150"], "answer": 2, "explanation": "35 × 4 = 140."}, {"n": 7, "text": "There are 42 crayons shared equally among 6 boxes. How many crayons in each box?", "choices": ["6", "7", "8", "9"], "answer": 1, "explanation": "42 ÷ 6 = 7."}, {"n": 8, "text": "Which fraction is equivalent to 2/3?", "choices": ["1/3", "2/4", "3/5", "4/6"], "answer": 3, "explanation": "4/6 = 2/3."}, {"n": 9, "text": "Compare: 4/6 □ 2/6. Which symbol belongs?", "choices": ["÷", "=", "<", ">"], "answer": 3, "explanation": "4/6 > 2/6."}, {"n": 10, "text": "3/8 + 3/8 = ?", "choices": ["3/16", "6/16", "6/8", "9/8"], "answer": 2, "explanation": "3/8 + 3/8 = 6/8."}, {"n": 11, "text": "A rectangle patio is 9 ft long and 4 ft wide. What is its perimeter?", "choices": ["13 ft", "18 ft", "26 ft", "36 ft"], "answer": 2, "explanation": "2(9+4) = 26 ft."}, {"n": 12, "text": "A rectangle is 7 m long and 2 m wide. What is its area?", "choices": ["9 square meters", "14 square meters", "18 square meters", "28 square meters"], "answer": 1, "explanation": "7 × 2 = 14."}, {"n": 13, "text": "How many millimeters are in 3 centimeters? (10 mm = 1 cm)", "choices": ["3", "13", "30", "300"], "answer": 2, "explanation": "3 cm = 30 mm."}, {"n": 14, "text": "School ends at 3:20. Soccer practice starts at 4:05. How much time is between them?", "choices": ["55 minutes", "1 hour 15 minutes", "45 minutes", "35 minutes"], "answer": 2, "explanation": "3:20 to 4:05 = 45 minutes."}, {"n": 15, "text": "Nina has 90¢. She spends 45¢ on stickers. How much does she have left?", "choices": ["35¢", "40¢", "45¢", "55¢"], "answer": 2, "explanation": "90 − 45 = 45¢."}, {"n": 16, "text": "Which number sentence is true?", "choices": ["6 ÷ 1 = 1", "6 × 0 = 6", "6 × 1 = 6", "6 + 0 = 0"], "answer": 2, "explanation": "6 × 1 = 6."}, {"n": 17, "text": "Find the missing number: □ × 5 = 45", "choices": ["7", "8", "9", "10"], "answer": 2, "explanation": "9 × 5 = 45."}, {"n": 18, "text": "A pictograph uses each ● = 3 points. If a team has ●●●●●, how many points?", "choices": ["5", "10", "15", "20"], "answer": 2, "explanation": "5 × 3 = 15."}, {"n": 19, "text": "Bar graph: Dogs 9, Cats 14, Birds 6. How many dogs and birds together?", "choices": ["14", "15", "20", "23"], "answer": 1, "explanation": "9 + 6 = 15."}, {"n": 20, "text": "Best estimate for 312 − 189?", "choices": ["50", "100", "200", "300"], "answer": 1, "explanation": "312 ≈ 300, 189 ≈ 200; 300 − 200 = 100 (actual 123)."}, {"n": 21, "text": "6,000 + 400 + 20 + 1 = ?", "choices": ["6,241", "6,412", "6,421", "64,021"], "answer": 2, "explanation": "6,421."}, {"n": 22, "text": "A rope is 5 feet long. How many inches is that?", "choices": ["50", "55", "60", "65"], "answer": 2, "explanation": "5 × 12 = 60 inches."}, {"n": 23, "text": "Which fraction is least?", "choices": ["1/8", "1/2", "2/3", "3/4"], "answer": 0, "explanation": "1/8 is the least."}, {"n": 24, "text": "56 ÷ 7 = ?", "choices": ["6", "7", "8", "9"], "answer": 2, "explanation": "56 ÷ 7 = 8."}, {"n": 25, "text": "A garden bed has sides 10 m, 6 m, 10 m, and 6 m. What is the perimeter?", "choices": ["22 m", "26 m", "32 m", "60 m"], "answer": 2, "explanation": "10+6+10+6 = 32 m."}, {"n": 26, "text": "If 25 − n = 11, what is n?", "choices": ["13", "14", "16", "36"], "answer": 1, "explanation": "n = 25 − 11 = 14."}, {"n": 27, "text": "Which shows 2 thousands, 4 hundreds, 0 tens, 6 ones?", "choices": ["246", "2,406", "2,460", "24,006"], "answer": 1, "explanation": "2,406."}, {"n": 28, "text": "A store sold 87 hats on Monday and 94 on Tuesday. Estimate the total by rounding each to the nearest ten.", "choices": ["160", "170", "180", "190"], "answer": 2, "explanation": "90 + 90 = 180."}]}, {"id": 3, "level": "Hard", "passages": [{"title": "Passage 1 — The Lantern Map (Fiction)", "paragraphs": ["On the first night of Harbor Festival, Elena clutched a folded scrap of paper her uncle had drawn that morning. “It’s a lantern map,” he whispered. “Follow the blue lights, not the red ones. Red lanterns lead to food stalls. Blue ones lead to the dock where the fireworks raft waits.” Elena nodded, though the crowded pier already hummed with music, smoke from grilled corn, and the slap of waves against wooden posts.", "At the first fork she almost turned toward a glowing red arch—her favorite caramel popcorn stand was that way—but she pressed her thumb on the blue arrow her uncle had sketched and kept walking. Twice she had to step aside for a parade of dancers with paper dragon heads. Once she thought she had lost the blue line entirely, until she noticed that the blue lanterns hung slightly higher than the red ones, as if someone had planned the path for people who looked up.", "When she reached the dock, her uncle was already there, smiling. “You chose carefully,” he said. Elena realized the map had never been only about finding fireworks. It had been about practicing how to stay on a path when brighter, louder things tried to pull her away."]}, {"title": "Passage 2 — Why Autumn Leaves Change Color (Nonfiction)", "paragraphs": ["In summer, many tree leaves look green because they contain a pigment called chlorophyll. Chlorophyll helps plants capture sunlight and make food. As days grow shorter and temperatures cool in autumn, trees begin to prepare for winter. They slow down food-making and break down chlorophyll. When the green fades, other pigments that were present all along—but hidden—become easier to see.", "Yellow and orange colors come from pigments called carotenoids. Red and purple colors often come from anthocyanins, which some trees produce in autumn. Not every tree makes the same mix, which is why a hillside can look like a patchwork of gold, scarlet, and brown. Weather matters too: sunny days and cool (but not freezing) nights often deepen red colors.", "Fallen leaves are not wasted. They break down and return nutrients to the soil, feeding the tree and other living things. Scientists study leaf color because it can reveal how forests respond to climate and seasonal change. For hikers, the changing canopy is a reminder that trees are living systems quietly adjusting to the year."]}, {"title": "Passage 3 — The Debate Bench (Fiction)", "paragraphs": ["Marcus had prepared index cards for the school debate about whether the playground should get new climbing ropes or a quiet reading garden. He planned to argue for ropes. His partner, Sophia, would argue for the garden. They sat on the “debate bench” behind the gym, reviewing points, when the fire alarm chirped for a surprise drill.", "During the drill, Marcus watched younger students line up carefully in the shade. One kindergartner clutched a picture book as if it were a shield. Sophia noticed too. After they returned inside, she said, “What if the best answer isn’t ropes or garden—what if we propose both, in zones?” Marcus frowned at his neat cards. Splitting the idea felt like breaking a rule.", "Their teacher, Mr. Hale, allowed the change. “Debates can discover better questions,” he said. Marcus rewrote his opening: instead of attacking the garden, he explained how active play and quiet reading could share the yard if paths and signs kept them apart. When they finished, the class voted not for a winner, but for a plan to sketch a map. Marcus tucked his old cards away. Winning, he decided, had been the wrong scoreboard all along."]}, {"title": "Passage 4 — Desert Tortoise Strategies (Nonfiction)", "paragraphs": ["Desert tortoises live in hot, dry places where shade and water can be scarce. To survive, they dig burrows—underground tunnels that stay cooler during the day and warmer on chilly nights. A tortoise may spend much of the hottest hours resting in its burrow, coming out mainly in the morning or evening to search for grasses, wildflowers, and cactus fruits.", "Tortoises store water in their bodies and can go a long time between drinks. When rain finally falls, they may dig shallow basins that collect puddles. Their hard shells protect them from some predators, but habitat loss and busy roads remain serious dangers. Wildlife scientists mark shells carefully to track individuals over years without harming them.", "Compared with animals that migrate long distances for food, desert tortoises rely more on staying put and using the landscape cleverly. Understanding these strategies helps people design safer roads and protected areas so tortoises can keep living where they belong."]}, {"title": "Passage 5 — Sundials and Clocks (Nonfiction / Compare–Contrast)", "paragraphs": ["Long before phones buzzed with the hour, people used sundials to tell time. A sundial has a flat face marked with hours and a raised piece called a gnomon. As the Sun moves across the sky, the gnomon’s shadow sweeps across the face, pointing near the correct hour on a sunny day. Sundials need sunlight, so cloudy weather or nighttime makes them useless for precise timekeeping.", "Mechanical clocks—and later electric and digital clocks—work differently. They measure time with steady inner motions or electronic signals, not with shadows. Clocks can run indoors, at night, and in storms. Early town clocks helped people agree on meeting times for markets, trains, and school bells.", "Both tools answer the same human need: organizing the day. Yet they depend on different clues. A sundial ties time to Earth’s turning under the Sun. A clock ties time to a machine’s rhythm. Comparing them shows how inventiveness grows when people ask, “What if the sky is cloudy?” Modern life still borrows both ideas—phone clocks for exact minutes, and the Sun’s path for seasons, gardens, and the feeling of a long summer afternoon."]}], "reading": [{"n": 1, "passage": 0, "text": "What does Elena’s uncle tell her the blue lanterns lead to?", "choices": ["The caramel popcorn stand", "The dock where the fireworks raft waits", "The paper dragon parade", "Her uncle’s house"], "answer": 1, "explanation": "Uncle says blue lanterns lead to the dock with the fireworks raft."}, {"n": 2, "passage": 0, "text": "Why does Elena almost turn toward the red arch?", "choices": ["Her uncle told her to follow red lights.", "She wanted to join the dancers.", "The blue lanterns were broken.", "Her favorite caramel popcorn stand was that way."], "answer": 3, "explanation": "Her favorite caramel popcorn stand was past the red arch."}, {"n": 3, "passage": 0, "text": "What detail helps Elena find the blue path again after she thinks she has lost it?", "choices": ["The blue lanterns hang slightly higher than the red ones.", "A dancer points the way.", "She hears fireworks early.", "She smells grilled corn."], "answer": 0, "explanation": "She notices blue lanterns hang slightly higher than red ones."}, {"n": 4, "passage": 0, "text": "The phrase “brighter, louder things tried to pull her away” most nearly suggests that —", "choices": ["Elena disliked music.", "Distractions made it hard to stay on her planned path.", "The pier was empty and silent.", "The map was written in invisible ink."], "answer": 1, "explanation": "It means distractions competed with her planned path."}, {"n": 5, "passage": 0, "text": "What does Elena realize at the end of the passage?", "choices": ["Red lanterns were safer than blue ones.", "Her uncle never meant for her to reach the dock.", "The map also taught her to stay focused despite distractions.", "The map was only about finding popcorn."], "answer": 2, "explanation": "The map also taught her to stay focused despite distractions."}, {"n": 6, "passage": 0, "text": "Which word best describes how Elena behaves during the festival walk?", "choices": ["Bored", "Angry", "Determined", "Careless"], "answer": 2, "explanation": "She resists temptations and keeps following the blue path—determined."}, {"n": 7, "passage": 1, "text": "According to the passage, chlorophyll mainly helps plants —", "choices": ["Capture sunlight and make food", "Scare insects away", "Turn leaves brown overnight", "Grow flowers in winter"], "answer": 0, "explanation": "Chlorophyll helps plants capture sunlight and make food."}, {"n": 8, "passage": 1, "text": "Why do other leaf colors become easier to see in autumn?", "choices": ["Carotenoids disappear completely.", "All trees produce only anthocyanins.", "Chlorophyll breaks down and the green fades.", "Trees paint their leaves with dye."], "answer": 2, "explanation": "When chlorophyll breaks down, green fades and other pigments show."}, {"n": 9, "passage": 1, "text": "What do carotenoids contribute to leaf color?", "choices": ["Bright blue veins", "Yellow and orange", "White spots", "Only deep purple"], "answer": 1, "explanation": "Carotenoids give yellow and orange colors."}, {"n": 10, "passage": 1, "text": "Which weather pattern does the passage say often deepens red colors?", "choices": ["Warm rainy nights only", "Complete darkness for a week", "Sunny days and cool (but not freezing) nights", "Constant freezing temperatures"], "answer": 2, "explanation": "Sunny days and cool (not freezing) nights deepen reds."}, {"n": 11, "passage": 1, "text": "In the last paragraph, the author mentions fallen leaves mainly to show that —", "choices": ["Scientists dislike autumn.", "Fallen leaves return nutrients to the soil.", "Leaves are useless once they fall.", "Hikers should avoid forests."], "answer": 1, "explanation": "Fallen leaves return nutrients to the soil."}, {"n": 12, "passage": 1, "text": "What is the author’s primary purpose in this passage?", "choices": ["To teach how to climb trees safely", "To explain why leaves change color and why it matters", "To entertain with a fairy tale about trees", "To list every tree species in the world"], "answer": 1, "explanation": "Purpose is to explain leaf color change and why it matters."}, {"n": 13, "passage": 2, "text": "What was the original debate topic?", "choices": ["Where to put the fire alarm", "Whether to cancel recess", "Climbing ropes versus a quiet reading garden", "How to choose debate partners"], "answer": 2, "explanation": "The debate was ropes versus a reading garden."}, {"n": 14, "passage": 2, "text": "What observation during the drill influences Sophia’s new idea?", "choices": ["A kindergartner holding a picture book for comfort", "Mr. Hale telling them to stop debating", "Older students racing ahead", "Marcus losing his index cards"], "answer": 0, "explanation": "She sees a kindergartner clutching a picture book."}, {"n": 15, "passage": 2, "text": "Why does Marcus frown when Sophia suggests proposing both?", "choices": ["He already drew a map.", "He hates reading gardens.", "He wants to cancel the debate.", "Changing the plan feels like breaking a rule to him."], "answer": 3, "explanation": "Changing the plan feels to him like breaking a rule."}, {"n": 16, "passage": 2, "text": "What does Mr. Hale mean by “Debates can discover better questions”?", "choices": ["Debates should always pick one winner only.", "Fire drills replace debates.", "Students should never change their topics.", "Talking through ideas can lead to smarter problems to solve."], "answer": 3, "explanation": "Discussion can lead to smarter questions/solutions."}, {"n": 17, "passage": 2, "text": "How does Marcus’s opening change after the teacher’s approval?", "choices": ["He refuses to speak.", "He argues only for ropes.", "He attacks the garden more strongly.", "He explains how play and reading spaces can share the yard."], "answer": 3, "explanation": "He explains how play and reading can share the yard."}, {"n": 18, "passage": 2, "text": "What lesson does Marcus take away at the end?", "choices": ["Index cards are useless.", "Kindergarteners should not bring books.", "Fire drills are more important than ideas.", "Focusing only on winning was the wrong measure of success."], "answer": 3, "explanation": "He decides winning was the wrong scoreboard."}, {"n": 19, "passage": 3, "text": "Why are burrows important for desert tortoises?", "choices": ["They store fireworks there.", "Burrows stay cooler by day and warmer at night.", "Burrows replace the need for shells.", "Burrows are used only once a year."], "answer": 1, "explanation": "Burrows stay cooler by day and warmer at night."}, {"n": 20, "passage": 3, "text": "When do tortoises often come out to search for food?", "choices": ["Only at noon in full heat", "Never; they never eat plants", "Only during snowstorms", "Mainly in the morning or evening"], "answer": 3, "explanation": "They mainly come out morning or evening."}, {"n": 21, "passage": 3, "text": "How do tortoises sometimes collect rainwater, according to the passage?", "choices": ["By digging shallow basins that hold puddles", "By flying to lakes", "By climbing trees", "By melting ice cubes"], "answer": 0, "explanation": "They dig shallow basins that collect puddles."}, {"n": 22, "passage": 3, "text": "The passage contrasts desert tortoises with migrating animals mainly to show that tortoises —", "choices": ["Prefer busy roads", "Rely more on staying put and using the landscape cleverly", "Do not need water", "Travel farther than birds"], "answer": 1, "explanation": "They rely more on staying put and using the landscape."}, {"n": 23, "passage": 3, "text": "What is one reason scientists mark tortoise shells?", "choices": ["To decorate them for festivals", "To remove their burrows", "To make shells heavier", "To track individuals over years without harming them"], "answer": 3, "explanation": "Marking helps track individuals without harming them."}, {"n": 24, "passage": 4, "text": "What does a sundial’s gnomon do?", "choices": ["Rings a school bell", "Powers electric clocks", "Stores water for plants", "Casts a shadow that moves across the hour marks"], "answer": 3, "explanation": "The gnomon casts a moving shadow on the hour marks."}, {"n": 25, "passage": 4, "text": "According to the passage, a major limitation of sundials is that they —", "choices": ["Work only underwater", "Are louder than clocks", "Need sunlight and fail in cloudy weather or at night", "Cannot be marked with hours"], "answer": 2, "explanation": "Sundials need sunlight; clouds/night make them useless for precise time."}, {"n": 26, "passage": 4, "text": "How do mechanical or digital clocks differ from sundials in what they depend on?", "choices": ["They depend on shadows from the Moon only.", "They use steady inner motions or electronic signals rather than shadows.", "They require a gnomon on every phone.", "They work only outdoors at noon."], "answer": 1, "explanation": "Clocks use inner motions or electronic signals, not shadows."}, {"n": 27, "passage": 4, "text": "What need do both sundials and clocks share, according to the passage?", "choices": ["Replacing the Sun", "Decorating festivals only", "Predicting earthquakes", "Organizing the day / agreeing on time"], "answer": 3, "explanation": "Both help organize the day / agree on time."}, {"n": 28, "passage": 4, "text": "Which statement best expresses the author’s compare–contrast point?", "choices": ["Both tools organize time but rely on different clues, and inventiveness grows from that challenge.", "Sundials are more accurate than all modern clocks.", "Clocks made sundials completely worthless for every purpose.", "People never needed agreed-upon meeting times."], "answer": 0, "explanation": "Both organize time via different clues; inventiveness grows from limits."}], "math": [{"n": 1, "text": "In 58,304, what is the value of the digit 8?", "choices": ["8", "80", "800", "8,000"], "answer": 3, "explanation": "8 is in the thousands place → 8,000."}, {"n": 2, "text": "Which number equals 7 × 1,000 + 0 × 100 + 4 × 10 + 9 × 1?", "choices": ["749", "7,049", "7,409", "70,049"], "answer": 1, "explanation": "7,000 + 0 + 40 + 9 = 7,049."}, {"n": 3, "text": "A school library has 2,486 fiction books and 1,759 nonfiction books. About how many books is that in all if you round each number to the nearest hundred before adding?", "choices": ["4,000", "4,200", "4,300", "4,500"], "answer": 2, "explanation": "2,500 + 1,800 = 4,300."}, {"n": 4, "text": "Maya buys 3 packs of markers for $4 each and a sketchbook for $7. She pays with a $20 bill. How much change should she receive?", "choices": ["$1", "$2", "$3", "$5"], "answer": 0, "explanation": "3×4=12; 12+7=19; 20−19=$1."}, {"n": 5, "text": "A baker made 96 muffins. She sold 5/8 of them before noon. How many muffins were sold before noon?", "choices": ["48", "54", "60", "72"], "answer": 2, "explanation": "96 ÷ 8 = 12; 5×12 = 60."}, {"n": 6, "text": "Which fraction is equivalent to 3/4?", "choices": ["3/8", "6/10", "9/12", "4/3"], "answer": 2, "explanation": "9/12 = 3/4 (divide by 3)."}, {"n": 7, "text": "Compare: 5/6 □ 7/8. Which symbol makes the statement true? (Hint: compare to 1, or use common reasoning about how close each is to 1.)", "choices": ["5/6 = 7/8", "5/6 > 7/8", "5/6 < 7/8", "Cannot be compared"], "answer": 2, "explanation": "5/6= about 0.833; 7/8=0.875; so 5/6 < 7/8. (Missing to 1: 1/6>1/8.)"}, {"n": 8, "text": "Jordan ran 2.5 kilometers on Monday and 1.75 kilometers on Tuesday. How far did he run in all over the two days?", "choices": ["3.25 km", "3.75 km", "4.15 km", "4.25 km"], "answer": 3, "explanation": "2.5 + 1.75 = 4.25 km."}, {"n": 9, "text": "A rectangular garden is 12 feet long and 7 feet wide. What is its perimeter?", "choices": ["19 ft", "26 ft", "38 ft", "84 ft"], "answer": 2, "explanation": "2×(12+7)=38 ft."}, {"n": 10, "text": "The same garden (12 ft by 7 ft) will be covered with sod. What is its area?", "choices": ["19 square feet", "38 square feet", "42 square feet", "84 square feet"], "answer": 3, "explanation": "12×7=84 square feet."}, {"n": 11, "text": "An angle measures 90 degrees. What kind of angle is it?", "choices": ["Acute", "Obtuse", "Straight", "Right"], "answer": 3, "explanation": "90° is a right angle."}, {"n": 12, "text": "Which number is a common multiple of 4 and 6?", "choices": ["8", "10", "12", "14"], "answer": 2, "explanation": "12 is a multiple of both 4 and 6."}, {"n": 13, "text": "What are all the factor pairs of 18?", "choices": ["1×18, 2×9, 3×6", "Only 1 and 18", "1×18 and 2×9 only", "4×5 and 3×6"], "answer": 0, "explanation": "Factor pairs: 1×18, 2×9, 3×6."}, {"n": 14, "text": "A movie starts at 1:45 p.m. and lasts 1 hour 40 minutes. What time does it end?", "choices": ["2:25 p.m.", "3:25 p.m.", "3:45 p.m.", "3:15 p.m."], "answer": 1, "explanation": "1:45 + 1 hour = 2:45; +40 min = 3:25 p.m."}, {"n": 15, "text": "How many inches are in 5 feet 3 inches? (12 inches = 1 foot)", "choices": ["53", "60", "63", "73"], "answer": 2, "explanation": "5×12=60; 60+3=63 inches."}, {"n": 16, "text": "A pitcher holds 2 liters of lemonade. How many milliliters is that? (1 liter = 1,000 milliliters)", "choices": ["20", "200", "2,000", "20,000"], "answer": 2, "explanation": "2×1,000=2,000 mL."}, {"n": 17, "text": "The table shows books read: Ana 14, Ben 9, Cara 17, Diego 11. How many more books did Ana and Ben combined read than Cara?", "choices": ["4", "6", "8", "23"], "answer": 1, "explanation": "Ana+Ben=23; 23−17=6 more than Cara."}, {"n": 18, "text": "Using the same table (Ana 14, Ben 9, Cara 17, Diego 11), what is the total number of books read by all four students?", "choices": ["40", "51", "52", "61"], "answer": 1, "explanation": "14+9+17+11=51."}, {"n": 19, "text": "A rope is 3 meters long. Priya cuts off 85 centimeters. How many centimeters of rope remain? (1 m = 100 cm)", "choices": ["15 cm", "215 cm", "225 cm", "315 cm"], "answer": 1, "explanation": "3 m = 300 cm; 300−85=215 cm."}, {"n": 20, "text": "Which is the best estimate for 47 × 9?", "choices": ["about 50", "about 360", "about 450", "about 500"], "answer": 2, "explanation": "47≈50; 50×9=450."}, {"n": 21, "text": "If 6 × n = 54, what is n?", "choices": ["6", "8", "9", "12"], "answer": 2, "explanation": "54÷6=9."}, {"n": 22, "text": "A square has a perimeter of 36 cm. What is the length of one side?", "choices": ["6 cm", "8 cm", "9 cm", "12 cm"], "answer": 2, "explanation": "36÷4=9 cm."}, {"n": 23, "text": "Sam has 3/8 of a pizza. Leah has 2/8 of the same pizza. Together, what fraction of the pizza do they have? How much of the pizza is left?", "choices": ["5/8 together; 3/8 left", "6/8 together; 2/8 left", "5/16 together; 11/16 left", "1/8 together; 7/8 left"], "answer": 0, "explanation": "3/8+2/8=5/8; 1−5/8=3/8 left."}, {"n": 24, "text": "A store sold 128 notebooks in March and 175 in April. How many more notebooks were sold in April than in March?", "choices": ["47", "53", "57", "303"], "answer": 0, "explanation": "175−128=47."}, {"n": 25, "text": "Which statement is true?", "choices": ["9 is a factor of 3.", "Every multiple of 9 is also a multiple of 3.", "3 is not a factor of 9.", "Every multiple of 3 is also a multiple of 9."], "answer": 1, "explanation": "Any multiple of 9 is also a multiple of 3."}, {"n": 26, "text": "A triangle has angle measures 40°, 65°, and x°. The sum of angles in a triangle is 180°. What is x?", "choices": ["65°", "75°", "105°", "85°"], "answer": 1, "explanation": "180−40−65=75°."}, {"n": 27, "text": "Rounded to the nearest ten, 648 becomes 650. Rounded to the nearest hundred, what does 648 become?", "choices": ["600", "640", "650", "700"], "answer": 0, "explanation": "To nearest hundred: tens digit is 4 < 5, so 648 → 600."}, {"n": 28, "text": "A classroom has 4 rows of desks with 6 desks in each row. Two desks are removed for a reading corner. How many desks remain?", "choices": ["16", "18", "22", "24"], "answer": 2, "explanation": "4×6=24; 24−2=22."}]}, {"id": 4, "level": "Hard", "passages": [{"title": "Passage 1 — The Quiet Signal (Fiction)", "paragraphs": ["Noah’s robotics club was building a rover that had to cross a cardboard “canyon” without falling. Most teams shouted over one another and jammed motors into place. Noah preferred to watch. He noticed that when their rover’s front wheels spun too fast on the taped “sand,” the back end swung sideways and tipped toward the drop.", "He sketched a fix: slower front-wheel speed for the first three seconds, then equal power. His teammate Ava raised an eyebrow. “That sounds boring,” she said. “Boring might be the point,” Noah replied, pointing at the canyon edge. They tested the change. The rover crept, straightened, and crossed. Ava grinned. “Okay. Quiet ideas can be loud wins.”", "After the trial, their coach asked how they decided. Noah almost said he had guessed. Then he held up his notebook of wheel marks and timing notes. “We listened to what the rover was telling us,” he said. The coach nodded. “Engineers collect clues before they celebrate sparks.”"]}, {"title": "Passage 2 — How Wetlands Clean Water (Nonfiction)", "paragraphs": ["Wetlands—marshes, swamps, and similar soggy lands—act like nature’s filters. When water flows slowly through plants and soil, sediments settle out. Microorganisms break down some pollutants. Plant roots take up nutrients that might otherwise fuel harmful algae blooms in lakes and rivers.", "Because wetlands hold water like sponges, they can reduce flooding downstream after heavy rain. Birds, frogs, and fish use wetlands for food and nesting. When wetlands are drained for buildings or farms, communities may lose both wildlife habitat and natural flood control.", "People can protect wetlands by supporting buffer zones of plants along shores, reducing fertilizer runoff, and restoring damaged marsh areas. Scientists measure water clarity, plant health, and animal counts to judge whether a wetland is improving. A healthy wetland rarely looks empty; its “mess” of reeds and mud is part of the cleaning machine."]}, {"title": "Passage 3 — Two Trails, One Summit (Fiction)", "paragraphs": ["Twin cousins Inés and Theo planned to hike Pine Knob. The park map showed a steep Ridge Trail and a longer Switchback Trail. Inés wanted the Ridge Trail—“Shorter means sooner at the top.” Theo traced the Switchback line. “Longer can mean steadier. Less chance we quit halfway.”", "They compromised: start on Switchback, then cut over on a marked connector if they felt strong. Midway, Inés’s legs burned and she admitted the steady climb was smarter than she expected. Theo, usually cautious, surprised himself by suggesting they take the connector after all. At the summit they shared oranges and compared notes. Inés said the view felt earned twice—once by muscles, once by changing her mind. Theo said the best trail was the one they built together from two stubborn plans."]}, {"title": "Passage 4 — The Journey of a Paper Letter (Nonfiction)", "paragraphs": ["Even in an age of instant messages, paper letters still travel a carefully planned route. You write, seal an envelope, and add postage. At a collection box or post office, workers gather mail and take it to a sorting facility. Machines read addresses—sometimes with help from postal workers when handwriting is tricky—and separate letters by destination.", "Planes, trucks, and vans move bags of mail between cities. At the destination facility, letters are sorted again by neighborhood routes. A carrier walks or drives a route, placing your letter in a mailbox. Tracking codes on some mail help locate a piece if it goes astray, but ordinary stamps still rely on the same basic chain of careful hands and machines.", "Compared with a text message, a letter is slower yet more physical: paper, ink, and effort you can hold. That difference is why some people save letters for years. Understanding the journey also explains delays—weather, volume, or an unclear address can interrupt the chain at several points."]}, {"title": "Passage 5 — Bee Dances and Human Maps (Nonfiction / Compare–Contrast)", "paragraphs": ["Honeybees share information about food using a movement scientists call a waggle dance. Inside the dark hive, a bee that found rich flowers walks a figure-eight pattern. The angle of her waggle run, relative to gravity, relates to the angle of the food source relative to the Sun. The length of the waggle run relates to distance. Other bees sense the dance and can fly toward the flowers.", "Human maps work differently. They usually show places with symbols on paper or screens and rely on shared agreements—north at the top, a scale for distance, labels for roads. Bees do not draw; they perform. Humans rarely dance directions in a grocery store (though a pointing finger is a cousin of the idea).", "Both systems solve a similar problem: how to tell others where something useful is. Bees encode direction with the Sun and gravity; people encode direction with compass ideas and drawings. Studying both reminds us that communication can be spoken, drawn, or danced—so long as the audience understands the code."]}], "reading": [{"n": 1, "passage": 0, "text": "What problem does Noah notice with the rover?", "choices": ["Fast front wheels make the back swing and tip toward the drop.", "The canyon is made of metal.", "It never moves at all.", "Ava hides the motors."], "answer": 0, "explanation": "Fast front wheels make the back swing and tip toward the drop."}, {"n": 2, "passage": 0, "text": "What fix does Noah sketch?", "choices": ["Shout louder during tests", "Remove all wheels", "Make the canyon deeper", "Slower front-wheel speed for the first three seconds, then equal power"], "answer": 3, "explanation": "Slower front speed for three seconds, then equal power."}, {"n": 3, "passage": 0, "text": "What does Ava mean by “Quiet ideas can be loud wins”?", "choices": ["Whispering always wins contests.", "Noah should stop taking notes.", "Robots should be silent forever.", "A careful, less flashy idea can still succeed dramatically."], "answer": 3, "explanation": "A careful idea can still succeed in a big way."}, {"n": 4, "passage": 0, "text": "How does Noah support his explanation to the coach?", "choices": ["He shows notebook notes about wheel marks and timing.", "He turns off the lights.", "He blames Ava.", "He guesses without evidence."], "answer": 0, "explanation": "He shows notebook evidence of marks and timing."}, {"n": 5, "passage": 0, "text": "What does the coach’s line “Engineers collect clues before they celebrate sparks” suggest?", "choices": ["Careful observation should come before flashy success.", "Sparks are more important than safety.", "Notebooks are optional decoration.", "Engineers should ignore data."], "answer": 0, "explanation": "Observe and gather clues before celebrating flashy success."}, {"n": 6, "passage": 0, "text": "Which trait best describes Noah in this passage?", "choices": ["Boastful", "Careless", "Impulsive", "Observant"], "answer": 3, "explanation": "He watches carefully and records clues—observant."}, {"n": 7, "passage": 1, "text": "According to the passage, wetlands act like nature’s filters mainly because —", "choices": ["Water speeds up and washes everything away", "They freeze pollutants into ice cubes", "Slow-moving water lets sediments settle and plants/microbes remove some pollutants", "They are always dry and dusty"], "answer": 2, "explanation": "Slow flow lets sediments settle; plants/microbes help clean."}, {"n": 8, "passage": 1, "text": "How can wetlands help after heavy rain?", "choices": ["By removing all clouds", "By holding water like sponges and reducing flooding downstream", "By blocking every river permanently", "By increasing floods downstream"], "answer": 1, "explanation": "Wetlands hold water and can reduce downstream flooding."}, {"n": 9, "passage": 1, "text": "What may communities lose when wetlands are drained?", "choices": ["All sunlight", "The need for plants anywhere", "Wildlife habitat and natural flood control", "Only louder traffic"], "answer": 2, "explanation": "Habitat and natural flood control may be lost."}, {"n": 10, "passage": 1, "text": "In the last paragraph, why does the author put “mess” in quotation marks?", "choices": ["To prove wetlands are worthless", "To show that reeds and mud look untidy but are useful to the cleaning system", "To mean wetlands should be paved", "To insult scientists"], "answer": 1, "explanation": "“Mess” looks untidy but is part of the useful system."}, {"n": 11, "passage": 1, "text": "Which of these is a way people can protect wetlands, per the passage?", "choices": ["Draining every marsh", "Removing all reeds", "Dumping more fertilizer into rivers", "Supporting shore buffer plants and reducing fertilizer runoff"], "answer": 3, "explanation": "Buffer plants and less fertilizer runoff help."}, {"n": 12, "passage": 1, "text": "What is the main idea of this passage?", "choices": ["Floods never happen near wetlands.", "Wetlands filter water, support wildlife, and deser function fmtMin(ms){ return ms>=60000 && ms%60000===0 ? (ms/60000)+' minutes' : Math.round(ms/1000)+' seconds'; }
function bestFor(id){
  const n = UI.lastName; if(!n) return '';
  const r = (hist()[keyName(n)]||{attempts:[]}).attempts.filter(a=>a.testId===id);
  if(!r.length) return '';
  const best = Math.max(...r.map(a=>a.totalCorrect));
  return ` · best ${best}/56`;
}
