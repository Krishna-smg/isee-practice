er named an ichthyosaur.","evidence":{"para":2,"text":"It was later named an ichthyosaur."},"choices":["A dinosaur egg","A plesiosaur’s tooth","An ichthyosaur skeleton","A gold coin"],"answer":2,"n":19},{"passage":2,"cat":"Organization & Logic","text":"In the last paragraph, the author uses the word however to show —","explanation":"“However” signals a contrast: back then she was left out, but today she is honored.","evidence":{"para":3,"text":"Today, however, she is honored"},"choices":["that Mary stopped hunting fossils","that scientists still do not know about Mary","that the fossils were fake","a change from how Mary was treated then to how she is honored now"],"answer":3,"n":20},{"passage":2,"cat":"Main Idea","text":"What is the passage mostly about?","explanation":"The passage follows Mary’s life, her discoveries, and the unfair treatment she faced.","evidence":{"para":3,"text":"she is honored as one of the most important fossil hunters in history"},"choices":["A girl who became an important fossil hunter despite many challenges","How storms form along the coast","Why visitors like the beach","How to join a science society"],"answer":0,"n":21},{"passage":3,"cat":"Tone & Figurative Language","text":"In stanza 1, what does the poet compare the fog to?","explanation":"Lines 2–3 describe the fog as a damp, gray blanket tucked around the playground.","evidence":{"para":0,"text":"a blanket, damp and gray,"},"choices":["A sleepy cat","A damp gray blanket","A silver thread","A sheet of paper"],"answer":1,"n":22},{"passage":3,"cat":"Tone & Figurative Language","text":"The line “The streetlights glowed like sleepy eyes” is an example of —","explanation":"A simile compares two things using “like” or “as.” The streetlights are compared to sleepy eyes.","evidence":{"para":1,"text":"The streetlights glowed like sleepy eyes"},"choices":["a rhyme","a question","a simile","a fact"],"answer":2,"n":23},{"passage":3,"cat":"Inference","text":"Why can the speaker hear the dog but not see it?","explanation":"The poem is about thick fog. The dog is close enough to hear but hidden by the fog.","evidence":{"para":2,"text":"but could not see him there"},"choices":["The dog is hiding in the house.","It is the middle of the night.","The speaker’s eyes are closed.","The fog is too thick to see through."],"answer":3,"n":24},{"passage":3,"cat":"Vocabulary in Context","text":"In stanza 2, the word mist most nearly means —","explanation":"The poem is describing fog. Mist is like a light fog — tiny water drops in the air.","evidence":{"para":1,"text":"half-open in the mist"},"choices":["tiny drops of water floating in the air","a bright light","a cold breeze","a kind of flower"],"answer":0,"n":25},{"passage":3,"cat":"Supporting Details","text":"What happens at ten o’clock?","explanation":"Stanza 4: “By ten o’clock the sun broke through and rolled the fog away.”","evidence":{"para":3,"text":"By ten o’clock the sun broke through"},"choices":["The dog runs away.","The sun breaks through and the fog goes away.","The streetlights turn on.","It starts to rain."],"answer":1,"n":26},{"passage":3,"cat":"Organization & Logic","text":"How is the poem organized?","explanation":"It begins at dawn when the fog hides everything and ends when the sun rolls it away.","evidence":{"para":0,"text":"The playground disappeared at dawn;"},"choices":["Each stanza describes a different season.","It lists reasons fog is dangerous.","It follows the fog from when it arrives until it disappears.","It tells about a dream the speaker had."],"answer":2,"n":27},{"passage":3,"cat":"Tone & Figurative Language","text":"How does the speaker seem to feel about the fog?","explanation":"The speaker uses gentle, playful images (sleepy eyes, a happy nose, a brand-new day), which show delight.","evidence":{"para":3,"text":"to show a brand-new day."},"choices":["Terrified","Angry","Bored","Curious and delighted"],"answer":3,"n":28}],"math":[{"cat":"Number Sense & Operations","text":"In 71,563, which digit is in the hundreds place?","explanation":"From the right: 3 is ones, 6 is tens, 5 is hundreds.","table":null,"choices":["1","5","6","7"],"answer":1,"n":1},{"cat":"Number Sense & Operations","text":"Which number has 7 ten-thousands, 9 thousands, 8 hundreds, 0 tens, and 6 ones?","explanation":"7 ten-thousands, 9 thousands, 8 hundreds, 0 tens, 6 ones = 79,806.","table":null,"choices":["7,986","79,806","79,860","790,806"],"answer":1,"n":2},{"cat":"Number Sense & Operations","text":"What is 26,718 rounded to the nearest thousand?","explanation":"Look at the hundreds digit: 7. Since 7 is 5 or more, round up: 27,000.","table":null,"choices":["26,000","26,700","27,000","30,000"],"answer":2,"n":3},{"cat":"Number Sense & Operations","text":"1,346 + 2,587 = ?","explanation":"6+7=13 (carry 1), 4+8+1=13 (carry 1), 3+5+1=9, 1+2=3 → 3,933.","table":null,"choices":["3,933","3,943","4,833","4,933"],"answer":0,"n":4},{"cat":"Number Sense & Operations","text":"A farm stand had 615 ears of corn. It sold 238. How many ears of corn were left?","explanation":"615 − 238 = 377. Check: 377 + 238 = 615.","table":null,"choices":["377","387","423","853"],"answer":0,"n":5},{"cat":"Number Sense & Operations","text":"Each pack has 8 juice boxes. How many juice boxes are in 47 packs?","explanation":"47 × 8 = 40 × 8 + 7 × 8 = 320 + 56 = 376.","table":null,"choices":["55","326","376","386"],"answer":2,"n":6},{"cat":"Fractions & Decimals","text":"A pizza is cut into 12 equal slices. Eli eats 5 slices. What fraction of the pizza did he eat?","explanation":"He ate 5 of the 12 equal slices: 5/12.","table":null,"choices":["5/12","7/12","5/7","12/5"],"answer":0,"n":7},{"cat":"Fractions & Decimals","text":"4/12 is the same amount as which fraction?","explanation":"Divide top and bottom by 4: 4 ÷ 4 = 1 and 12 ÷ 4 = 3, so 1/3.","table":null,"choices":["1/4","1/3","4/8","2/3"],"answer":1,"n":8},{"cat":"Fractions & Decimals","text":"Jonah walked 5/6 of a mile. Ruby walked 2/6 of a mile. How much farther did Jonah walk?","explanation":"Subtract the tops, keep the bottom: 5/6 − 2/6 = 3/6.","table":null,"choices":["3/12 mile","2/6 mile","3/6 mile","7/6 miles"],"answer":2,"n":9},{"cat":"Fractions & Decimals","text":"What is 1.6 + 2.35?","explanation":"Line up the decimal points: 1.60 + 2.35 = 3.95.","table":null,"choices":["2.51","3.41","3.95","4.95"],"answer":2,"n":10},{"cat":"Fractions & Decimals","text":"Which decimal is the same as 3/100?","explanation":"Hundredths are two places after the decimal point: 3 hundredths = 0.03.","table":null,"choices":["0.003","0.03","0.3","3.0"],"answer":1,"n":11},{"cat":"Algebraic Thinking & Patterns","text":"What are the next two numbers in the pattern? 3, 6, 12, 24, ___, ___","explanation":"Each number doubles: 24 × 2 = 48, 48 × 2 = 96.","table":null,"choices":["48, 96","30, 36","36, 48","48, 72"],"answer":0,"n":12},{"cat":"Algebraic Thinking & Patterns","text":"What number goes in the box? □ × 6 = 84","explanation":"84 ÷ 6 = 14. Check: 14 × 6 = 84.","table":null,"choices":["12","13","14","78"],"answer":2,"n":13},{"cat":"Algebraic Thinking & Patterns","text":"Tickets cost $7 each. Which expression shows the cost of t tickets?","explanation":"Each ticket adds $7, so t tickets cost 7 × t dollars.","table":null,"choices":["7 + t","t − 7","t ÷ 7","7 × t"],"answer":3,"n":14},{"cat":"Algebraic Thinking & Patterns","text":"Look at the table. What is the rule?","explanation":"2×3+3 = 9, 4×3+3 = 15, 6×3+3 = 21. “Add 7” only works for the first row.","table":[["In","Out"],["2","9"],["4","15"],["6","21"]],"choices":["Multiply by 3, then add 3","Add 7","Multiply by 4","Add 11"],"answer":0,"n":15},{"cat":"Geometry","text":"How many vertices (corners) does a triangular prism have?","explanation":"A triangular prism has two triangle ends. Each triangle has 3 corners: 3 + 3 = 6 vertices.","table":null,"choices":["3","4","5","6"],"answer":3,"n":16},{"cat":"Geometry","text":"A square garden has sides of 13 feet. What is its perimeter?","explanation":"A square has 4 equal sides: 4 × 13 = 52 feet. (169 is the area.)","table":null,"choices":["26 feet","39 feet","52 feet","169 feet"],"answer":2,"n":17},{"cat":"Geometry","text":"A rectangle has an area of 48 square inches. Its length is 8 inches. What is its width?","explanation":"Area = length × width, so 8 × ? = 48. 48 ÷ 8 = 6 inches.","table":null,"choices":["5 inches","6 inches","40 inches","56 inches"],"answer":1,"n":18},{"cat":"Geometry","text":"An angle that is smaller than a right angle is called —","explanation":"Acute angles are less than 90°. Obtuse angles are more than 90°.","table":null,"choices":["an obtuse angle","a straight angle","a parallel angle","an acute angle"],"answer":3,"n":19},{"cat":"Geometry","text":"Which figure has more than 4 sides?","explanation":"A pentagon has 5 sides. Squares and trapezoids have 4; triangles have 3.","table":null,"choices":["Pentagon","Square","Trapezoid","Triangle"],"answer":0,"n":20},{"cat":"Measurement","text":"Swim practice begins at 4:35 p.m. and ends at 6:10 p.m. How long is practice?","explanation":"4:35 → 5:35 is 1 hour. 5:35 → 6:10 is 25 + 10 = 35 minutes. Total 1 hour 35 minutes.","table":null,"choices":["1 hour 25 minutes","1 hour 35 minutes","1 hour 45 minutes","2 hours 25 minutes"],"answer":1,"n":21},{"cat":"Measurement","text":"A rope is 4 yards long. How many feet long is it? (1 yard = 3 feet)","explanation":"4 yards × 3 feet each = 12 feet.","table":null,"choices":["4 feet","7 feet","9 feet","12 feet"],"answer":3,"n":22},{"cat":"Measurement","text":"Luis has 3 quarters, 2 dimes, and 4 pennies. How much money does he have?","explanation":"3 quarters = 75¢, 2 dimes = 20¢, 4 pennies = 4¢. 75 + 20 + 4 = 99¢.","table":null,"choices":["79¢","89¢","94¢","99¢"],"answer":3,"n":23},{"cat":"Measurement","text":"A puppy weighs 3 pounds. How many ounces is that? (1 pound = 16 ounces)","explanation":"3 × 16 = 48 ounces.","table":null,"choices":["19 ounces","32 ounces","48 ounces","64 ounces"],"answer":2,"n":24},{"cat":"Data Analysis & Probability","text":"The table shows votes for a class pet. How many students voted in all?","explanation":"17 + 11 + 8 + 13 = 49.","table":[["Pet","Votes"],["Hamster","17"],["Fish","11"],["Lizard","8"],["Rabbit","13"]],"choices":["49","50","51","59"],"answer":0,"n":25},{"cat":"Data Analysis & Probability","text":"Using the same table, how many more votes did Hamster get than Rabbit?","explanation":"17 − 13 = 4.","table":[["Pet","Votes"],["Hamster","17"],["Fish","11"],["Lizard","8"],["Rabbit","13"]],"choices":["3","4","6","30"],"answer":1,"n":26},{"cat":"Data Analysis & Probability","text":"A spinner has 8 equal parts: 3 are blue, 4 are yellow, and 1 is red. What is the probability of landing on yellow?","explanation":"4 of the 8 equal parts are yellow, so the probability is 4 out of 8.","table":null,"choices":["1 out of 8","3 out of 8","4 out of 4","4 out of 8"],"answer":3,"n":27},{"cat":"Data Analysis & Probability","text":"Five friends’ quiz scores were 6, 9, 9, 7, and 9. Which score appears most often?","explanation":"9 appears three times — more than any other score.","table":null,"choices":["6","7","8","9"],"answer":3,"n":28}]},{"id":3,"level":"Challenge","passages":[{"title":"The Chess Clock","genre":"Fiction","poem":false,"paragraphs":["Dev had never lost to his cousin Hana at chess, not once in three summers. So when she showed up at the community chess club with a wooden chess clock tucked under her arm, he only shrugged. “Clocks are for people who are in a hurry,” he said. “I like to think.”","Hana set the clock between them and pressed a button. “Ten minutes each,” she said. “When it’s your turn, your time runs. After you move, tap your side.” Dev rolled his eyes but agreed.","For the first few moves, Dev played the way he always did, studying the board while his fingers drummed on the table. Then he glanced at the clock. Four of his minutes had melted away, and Hana had used barely one. His stomach tightened. He began moving faster, then too fast. He left his bishop where her knight could take it, and she did, with a polite little “Sorry.”","When the small flag on his side of the clock dropped, Dev still had more pieces than Hana, but it didn’t matter. His time had run out, and the game was hers. He sat very still, staring at the fallen flag as if it had personally betrayed him.","Mrs. Lindqvist, the club leader, wandered over. “Most players spend their minutes like birthday money,” she said, “all at once, on the first shiny thing.” She showed Dev how to plan his ideas while Hana was thinking, so that his own turns could be quick and sure. The next Saturday, Dev arrived early, carrying a chess clock of his own."]},{"title":"Why the Moon Seems to Change Shape","genre":"Nonfiction / Science","poem":false,"paragraphs":["Some nights the Moon looks like a glowing circle; other nights it is a thin sliver, and some nights you cannot see it at all. The Moon is not actually changing shape. It is always a ball of rock. What changes is how much of its sunlit side we can see from Earth.","The Moon does not make its own light. The Sun always lights up half of the Moon, just as it lights up half of Earth. As the Moon travels around Earth, we view that bright half from different angles. These changing views are called phases. One full cycle of phases takes about twenty-nine and a half days.","When the Moon is between Earth and the Sun, its lit side faces away from us, and we see a new moon, which looks dark. Over the next two weeks, more of the lit side comes into view. The Moon grows from a crescent to a half moon to a full moon, when the whole sunlit side faces Earth. Astronomers say the Moon is waxing during this time. Then the pattern reverses, and the Moon wanes, shrinking back toward the next new moon.","People have used the Moon’s steady cycle for thousands of years. Many calendars, including some still used to set holidays today, are based on the phases of the Moon. The English word month even comes from an old word related to moon."]},{"title":"The Erie Canal","genre":"History","poem":false,"paragraphs":["In the early 1800s, moving goods across New York State was slow and costly. Wagons pulled by horses bumped along muddy roads, and a trip from the Great Lakes to New York City could take weeks. Governor DeWitt Clinton supported a daring plan: dig a canal, a human-made waterway, all the way from the Hudson River to Lake Erie.","Many people thought the idea was foolish. They mocked the project as “Clinton’s Ditch.” The canal would have to stretch about 363 miles, cross rivers and valleys, and climb more than 500 feet in height. Workers, many of them recent immigrants, dug much of it with shovels and picks, with the help of horses and mules.","To solve the problem of changing land heights, engineers built locks. A lock is a chamber with gates at each end. A boat enters, the gates close, and water is let in or out to raise or lower the boat to the next level, like an elevator made of water. The finished canal had 83 locks.","The Erie Canal opened in 1825. Boats pulled by mules walking on a path beside the water could carry heavy loads for a small part of the old cost. Farm goods from the West flowed east, and manufactured goods flowed west. New York City grew into the busiest port in the country, and new towns sprang up along the canal’s route. “Clinton’s Ditch” had become one of the most successful projects of its time."]},{"title":"The Old Bicycle","genre":"Poetry","poem":true,"paragraphs":["My brother’s bike was red, once—\nnow it’s the color of rust and rain.\nIts bell can only cough a little,\nits chain complains and complains.","It leaned all winter in the garage\nbehind the rakes and a broken chair,\ndreaming, I think, of hills and puddles\nand breezes combing someone’s hair.","This spring, Dad oiled the tired gears;\nI pumped the tires round and tight.\nI wobbled once, then twice, then—flew!\nThe old bike laughed. It still knew flight."]},{"title":"Why Bread Rises","genre":"Nonfiction / Science","poem":false,"paragraphs":["If you have ever watched a ball of dough puff up in a warm kitchen, you have seen tiny living things at work. Most bread is made with yeast, a kind of fungus so small that millions could fit on a spoon.","When a baker mixes yeast with flour and water, the yeast feeds on sugars in the flour. As it feeds, it gives off a gas called carbon dioxide. Kneading the dough builds stretchy strands of gluten, a protein found in wheat flour. These strands trap the gas in thousands of little bubbles, so the dough swells like a balloon.","Temperature matters. In a cold room, yeast works slowly, and the dough may take many hours to rise. In a warm spot, the yeast is more active and the dough rises faster. But if the water is too hot, it can kill the yeast, and the bread will stay flat and heavy.","When the bread finally goes into the oven, the heat makes the gas bubbles expand one last time before the yeast dies and the bread sets. Slice a loaf open and you can see the holes those bubbles left behind, a record of the yeast’s busy work."]}],"reading":[{"passage":0,"cat":"Inference","text":"When Dev says “Clocks are for people who are in a hurry,” he reveals that he —","explanation":"He adds, “I like to think,” showing he values taking his time over playing fast.","evidence":{"para":0,"text":"Clocks are for people who are in a hurry"},"choices":["believes slow, careful thinking matters more than speed","has never seen a chess clock before","wants to leave the club early","thinks Hana is a better player than he is"],"answer":0,"n":1},{"passage":0,"cat":"Tone & Figurative Language","text":"The phrase “Four of his minutes had melted away” suggests that —","explanation":"Things that melt disappear without you noticing. His minutes were gone before he realized it.","evidence":{"para":2,"text":"Four of his minutes had melted away"},"choices":["the clock was broken by the heat","his time disappeared faster than he expected","he had been eating ice cream","Hana had taken his time"],"answer":1,"n":2},{"passage":0,"cat":"Inference","text":"Why does Dev lose his bishop?","explanation":"His stomach tightened, he moved “too fast,” and then he left the bishop unprotected.","evidence":{"para":2,"text":"He began moving faster, then too fast."},"choices":["Hana breaks a rule of chess.","He decides to let Hana win.","He panics about time and moves without thinking carefully.","Mrs. Lindqvist tells him to move it."],"answer":2,"n":3},{"passage":0,"cat":"Organization & Logic","text":"Why does Dev lose the game even though he has more pieces?","explanation":"With a chess clock, running out of time loses the game, no matter how many pieces you have.","evidence":{"para":3,"text":"His time had run out, and the game was hers."},"choices":["Hana captures his king.","He gives up and leaves the table.","The club leader ends the game early.","His time runs out before the game ends."],"answer":3,"n":4},{"passage":0,"cat":"Tone & Figurative Language","text":"Mrs. Lindqvist compares spending minutes to spending birthday money. What is her point?","explanation":"People who spend birthday money all at once have none left later. Dev used his minutes too early.","evidence":{"para":4,"text":"Most players spend their minutes like birthday money"},"choices":["Players should plan their time instead of using it all up right away.","Players should buy their own chess clocks.","Chess is more fun than shopping.","Dev should give his money to Hana."],"answer":0,"n":5},{"passage":0,"cat":"Inference","text":"What does Dev’s decision to bring his own chess clock show?","explanation":"He arrives early with his own clock — he has changed his mind and wants to get better at timed games.","evidence":{"para":4,"text":"Dev arrived early, carrying a chess clock of his own"},"choices":["He wants to keep Hana from using hers.","He now sees the clock as a challenge worth practicing for.","He plans to quit the chess club.","He still thinks clocks are only for people in a hurry."],"answer":1,"n":6},{"passage":1,"cat":"Main Idea","text":"Which sentence best states the central idea of the passage?","explanation":"Paragraph 1 says the Moon does not change shape; what changes is how much sunlit side we see.","evidence":{"para":0,"text":"What changes is how much of its sunlit side we can see from Earth."},"choices":["The Moon changes its shape every night.","The Moon makes its own light, which grows and shrinks.","The Moon’s phases come from seeing different amounts of its sunlit side as it travels around Earth.","Earth’s shadow causes every phase of the Moon."],"answer":2,"n":7},{"passage":1,"cat":"Supporting Details","text":"According to the passage, what does the Moon look like when it is between Earth and the Sun?","explanation":"Paragraph 3 says the lit side faces away from us then, so we see a dark new moon.","evidence":{"para":2,"text":"we see a new moon, which looks dark"},"choices":["It looks full and bright.","It looks like a half moon.","It looks red.","It looks dark, which is called a new moon."],"answer":3,"n":8},{"passage":1,"cat":"Vocabulary in Context","text":"Based on the passage, when the Moon is waxing, it —","explanation":"Waxing is used for the time when the Moon grows from crescent to full. Waning is the opposite.","evidence":{"para":2,"text":"Astronomers say the Moon is waxing during this time."},"choices":["appears to grow larger each night","appears to shrink each night","stops moving around Earth","stays a crescent forever"],"answer":0,"n":9},{"passage":1,"cat":"Inference","text":"About how many days after a new moon would you expect to see a full moon?","explanation":"The passage says that over the next two weeks (about 14–15 days) the Moon grows to full. That is about half of the 29½-day cycle.","evidence":{"para":2,"text":"Over the next two weeks, more of the lit side comes into view."},"choices":["About 1 day","About 15 days","About 60 days","About 365 days"],"answer":1,"n":10},{"passage":1,"cat":"Organization & Logic","text":"Why does the author include the fact that the word month is related to moon?","explanation":"The last paragraph is about people using the Moon to keep time. The word month is one more piece of evidence.","evidence":{"para":3,"text":"The English word month even comes from an old word related to moon."},"choices":["To explain how the Moon got its name","To prove that the Moon is made of rock","To show how closely people have connected time with the Moon’s cycle","To argue that calendars are unnecessary"],"answer":2,"n":11},{"passage":1,"cat":"Inference","text":"Which statement would the author most likely agree with?","explanation":"Paragraph 2 says the Sun always lights half of the Moon — even during a new moon, the lit half just faces away.","evidence":{"para":1,"text":"The Sun always lights up half of the Moon"},"choices":["The Moon disappears during a new moon.","The Moon is bigger during a full moon.","Only Earth is lit by the Sun.","Half of the Moon is always lit by the Sun, even when we cannot see it."],"answer":3,"n":12},{"passage":2,"cat":"Vocabulary in Context","text":"In paragraph 1, the word canal is explained as —","explanation":"Right after the word, the author gives the meaning: “a human-made waterway.”","evidence":{"para":0,"text":"a human-made waterway"},"choices":["a human-made waterway","a muddy road","a type of wagon","a large lake"],"answer":0,"n":13},{"passage":2,"cat":"Inference","text":"Why did critics call the project “Clinton’s Ditch”?","explanation":"The paragraph begins, “Many people thought the idea was foolish.” Calling it a ditch made fun of it.","evidence":{"para":1,"text":"Many people thought the idea was foolish."},"choices":["Clinton dug the whole canal himself.","They thought it was a foolish plan that would not work.","It was the official name chosen by the state.","The canal was only a few feet long."],"answer":1,"n":14},{"passage":2,"cat":"Tone & Figurative Language","text":"The author describes a lock as “like an elevator made of water.” This comparison helps readers understand that a lock —","explanation":"An elevator moves people up and down between floors; a lock moves boats up and down between water levels.","evidence":{"para":2,"text":"like an elevator made of water"},"choices":["is a building with many floors","moves boats sideways across rivers","raises or lowers boats from one level to another","is powered by electricity"],"answer":2,"n":15},{"passage":2,"cat":"Organization & Logic","text":"How does paragraph 3 relate to paragraph 2?","explanation":"Paragraph 2 says the canal had to climb more than 500 feet. Paragraph 3 explains locks, the solution to that problem.","evidence":{"para":2,"text":"To solve the problem of changing land heights"},"choices":["It tells what happened after the canal closed.","It gives the opinion of the people who mocked the canal.","It describes a different canal in another state.","It explains how engineers solved a challenge described in paragraph 2."],"answer":3,"n":16},{"passage":2,"cat":"Supporting Details","text":"Which detail best supports the idea that the canal helped businesses?","explanation":"Cheaper shipping helps businesses earn more and trade more goods.","evidence":{"para":3,"text":"could carry heavy loads for a small part of the old cost"},"choices":["Boats could carry heavy loads for a small part of the old cost.","Many people mocked the project.","The canal had 83 locks.","Workers used shovels and picks."],"answer":0,"n":17},{"passage":2,"cat":"Tone & Figurative Language","text":"In the last sentence, the author uses the nickname “Clinton’s Ditch” again mainly to —","explanation":"The nickname was an insult, but the “ditch” became a huge success. Repeating it highlights how wrong the critics were.","evidence":{"para":3,"text":"had become one of the most successful projects of its time"},"choices":["show that the canal was renamed","show that the mocking nickname turned out to be wrong","prove the canal was only a ditch","quote something Clinton said"],"answer":1,"n":18},{"passage":3,"cat":"Tone & Figurative Language","text":"The poet writes that the bell “can only cough a little.” This means the bell —","explanation":"A small cough is a weak, scratchy sound. The old bell can’t ring clearly anymore.","evidence":{"para":0,"text":"Its bell can only cough a little,"},"choices":["is sick with a cold","rings very loudly","makes a weak, rough sound","has fallen off the bike"],"answer":2,"n":19},{"passage":3,"cat":"Inference","text":"Why does the speaker say the bike was red “once”?","explanation":"The next line says it is now “the color of rust and rain” — it is no longer bright red.","evidence":{"para":0,"text":"now it’s the color of rust and rain."},"choices":["The speaker painted it blue.","The bike was red for only one day.","The speaker’s brother never owned it.","The bike has faded and rusted over time."],"answer":3,"n":20},{"passage":3,"cat":"Tone & Figurative Language","text":"In stanza 2, the speaker imagines the bike “dreaming.” This gives the bike —","explanation":"Bikes can’t dream; giving it human feelings (personification) shows it seems to long for rides.","evidence":{"para":1,"text":"dreaming, I think, of hills and puddles"},"choices":["human feelings, as if it misses being ridden","a scary personality","a new coat of paint","the ability to talk"],"answer":0,"n":21},{"passage":3,"cat":"Organization & Logic","text":"How does the poem change from the first two stanzas to the last stanza?","explanation":"Stanzas 1–2 describe rust and a winter in the garage; stanza 3 shows it fixed and flying again.","evidence":{"para":2,"text":"This spring, Dad oiled the tired gears;"},"choices":["It moves from summer to winter.","It moves from a forgotten, worn-out bike to a bike that is ridden again.","It moves from happy to sad.","It changes from a poem about a bike to a poem about a car."],"answer":1,"n":22},{"passage":3,"cat":"Main Idea","text":"Which idea is most important in the poem?","explanation":"Once it is oiled and pumped up, the old bike “still knew flight” and brings joy.","evidence":{"para":2,"text":"It still knew flight."},"choices":["New bikes are always better than old ones.","Bikes should be kept in the garage.","Something old can still bring joy when it is cared for.","Riding a bike is dangerous."],"answer":2,"n":23},{"passage":4,"cat":"Supporting Details","text":"What gas does yeast give off as it feeds?","explanation":"Paragraph 2: “it gives off a gas called carbon dioxide.”","evidence":{"para":1,"text":"it gives off a gas called carbon dioxide"},"choices":["Oxygen","Steam","Helium","Carbon dioxide"],"answer":3,"n":24},{"passage":4,"cat":"Organization & Logic","text":"According to paragraph 2, what is the job of gluten?","explanation":"Cause and effect: kneading builds gluten strands → the strands trap the gas → the dough swells.","evidence":{"para":1,"text":"These strands trap the gas"},"choices":["It forms stretchy strands that trap gas bubbles.","It feeds the yeast.","It makes the bread taste sweet.","It kills the yeast in the oven."],"answer":0,"n":25},{"passage":4,"cat":"Inference","text":"A baker uses water that is much too hot. What will most likely happen?","explanation":"Paragraph 3 says water that is too hot can kill the yeast, and then the bread stays flat.","evidence":{"para":2,"text":"if the water is too hot, it can kill the yeast"},"choices":["The bread will rise twice as fast.","The bread will stay flat and heavy.","The dough will float like a balloon.","The yeast will make more gluten."],"answer":1,"n":26},{"passage":4,"cat":"Vocabulary in Context","text":"In paragraph 4, the word sets most nearly means —","explanation":"In the oven, soft dough turns into solid bread — it becomes firm.","evidence":{"para":3,"text":"the bread sets"},"choices":["is placed on a table","goes down like the sun","becomes firm","is sold in a group"],"answer":2,"n":27},{"passage":4,"cat":"Main Idea","text":"Which statement best summarizes the passage?","explanation":"A good summary includes the main points of every paragraph: yeast, gas, gluten, and temperature.","evidence":{"para":0,"text":"you have seen tiny living things at work"},"choices":["Bread rises because bakers blow air into the dough.","Ovens are the only thing that makes bread rise.","Gluten is a fungus that eats flour.","Yeast makes gas that gluten traps, making bread rise, and temperature affects how well this works."],"answer":3,"n":28}],"math":[{"cat":"Number Sense & Operations","text":"In 784,215, how much is the digit 8 worth?","explanation":"Place values from the right: 5 ones, 1 ten, 2 hundreds, 4 thousands, 8 ten-thousands. So the 8 is worth 80,000.","table":null,"choices":["8,000","80,000","800,000","8,000,000"],"answer":1,"n":1},{"cat":"Number Sense & Operations","text":"Which number is 1,000 more than 69,507?","explanation":"Add 1 to the thousands digit: 69 thousand + 1 thousand = 70 thousand. 70,507.","table":null,"choices":["69,607","70,407","70,507","79,507"],"answer":2,"n":2},{"cat":"Number Sense & Operations","text":"A stadium sold 4,385 tickets on Friday and 2,947 tickets on Saturday. How many more tickets were sold on Friday?","explanation":"4,385 − 2,947 = 1,438. Check: 1,438 + 2,947 = 4,385. (7,332 is the sum, not the difference.)","table":null,"choices":["1,438","1,442","1,548","7,332"],"answer":0,"n":3},{"cat":"Number Sense & Operations","text":"A school orders 14 boxes of pencils with 36 pencils in each box. It gives 75 pencils to the art room. How many pencils are left?","explanation":"Step 1: 14 × 36 = 504 pencils. Step 2: 504 − 75 = 429 pencils left.","table":null,"choices":["429","439","504","579"],"answer":0,"n":4},{"cat":"Number Sense & Operations","text":"Movie tickets cost $7 each. Which is the best estimate of the cost of 63 tickets?","explanation":"Round 63 to 60. 60 × $7 = $420. (The exact cost is $441, which is closest to $420.)","table":null,"choices":["$42","$320","$420","$4,200"],"answer":2,"n":5},{"cat":"Number Sense & Operations","text":"Kofi has 4 times as many baseball cards as Ming. Ming has 23 cards. How many cards do they have together?","explanation":"Kofi: 4 × 23 = 92. Together: 92 + 23 = 115. (92 is only Kofi’s cards.)","table":null,"choices":["92","104","115","119"],"answer":2,"n":6},{"cat":"Fractions & Decimals","text":"Which list is in order from least to greatest?","explanation":"2/5 is less than half (half of 5 is 2½). 3/4 is more than half. So 2/5, 1/2, 3/4.","table":null,"choices":["2/5, 1/2, 3/4","3/4, 1/2, 2/5","1/2, 2/5, 3/4","2/5, 3/4, 1/2"],"answer":0,"n":7},{"cat":"Fractions & Decimals","text":"A recipe uses 2/3 cup of oats for one batch of granola. How many cups of oats are needed for 4 batches?","explanation":"4 × 2/3 = 8/3. 8/3 = 2 wholes (6/3) and 2/3 more = 2 2/3 cups.","table":null,"choices":["1 1/3 cups","2 2/3 cups","3 cups","3 2/3 cups"],"answer":1,"n":8},{"cat":"Fractions & Decimals","text":"Which decimal is greatest?","explanation":"Compare tenths first: 0.8 has 8 tenths; 0.79 and 0.708 have 7 tenths; 0.098 has 0 tenths. 0.8 is greatest.","table":null,"choices":["0.098","0.708","0.79","0.8"],"answer":3,"n":9},{"cat":"Fractions & Decimals","text":"Amara ran 1.4 miles on Monday and 0.85 mile on Tuesday. How much farther did she run on Monday?","explanation":"Write 1.4 as 1.40. 1.40 − 0.85 = 0.55 mile. (2.25 is the sum.)","table":null,"choices":["0.55 mile","0.65 mile","1.15 miles","2.25 miles"],"answer":0,"n":10},{"cat":"Fractions & Decimals","text":"A garden is divided into 10 equal parts. 3/10 of it is tomatoes and 0.4 of it is peppers. The rest is beans. What fraction of the garden is beans?","explanation":"0.4 = 4/10. Tomatoes + peppers = 3/10 + 4/10 = 7/10. Beans = 10/10 − 7/10 = 3/10.","table":null,"choices":["1/10","3/10","4/10","7/10"],"answer":1,"n":11},{"cat":"Algebraic Thinking & Patterns","text":"What is the 8th number in this pattern? 5, 9, 13, 17, . . .","explanation":"Add 4 each time: 5, 9, 13, 17, 21, 25, 29, 33. The 8th number is 33.","table":null,"choices":["29","31","32","33"],"answer":3,"n":12},{"cat":"Algebraic Thinking & Patterns","text":"Find the value of n: 3 × n + 4 = 31","explanation":"Work backward: 31 − 4 = 27, then 27 ÷ 3 = 9. Check: 3 × 9 + 4 = 31.","table":null,"choices":["5","7","8","9"],"answer":3,"n":13},{"cat":"Algebraic Thinking & Patterns","text":"A kayak rental costs $8 plus $2 for each hour. Which expression shows the cost for h hours?","explanation":"You pay $8 once, plus $2 for every hour (2 × h). Example: 3 hours = 8 + 6 = $14.","table":null,"choices":["8 × 2 + h","(8 + 2) × h","2 + h","8 + 2 × h"],"answer":3,"n":14},{"cat":"Algebraic Thinking & Patterns","text":"Squares are made from toothpicks in a row. 1 square uses 4 toothpicks, 2 squares use 7, and 3 squares use 10. How many toothpicks are needed for 6 squares?","explanation":"Each new square adds 3 toothpicks: 10, 13, 16, 19. So 6 squares need 19. (24 would be 6 separate squares.)","table":null,"choices":["18","19","22","24"],"answer":1,"n":15},{"cat":"Geometry","text":"An L-shaped patio is made of two rectangles. One is 8 m by 3 m and the other is 4 m by 5 m. What is the total area of the patio?","explanation":"8 × 3 = 24 and 4 × 5 = 20. Add the parts: 24 + 20 = 44 square meters.","table":null,"choices":["20 square meters","34 square meters","44 square meters","64 square meters"],"answer":2,"n":16},{"cat":"Geometry","text":"A rectangle has a perimeter of 30 cm. Its length is 9 cm. What is its width?","explanation":"Two lengths = 9 + 9 = 18 cm. 30 − 18 = 12 cm for the two widths. 12 ÷ 2 = 6 cm.","table":null,"choices":["3 cm","6 cm","12 cm","21 cm"],"answer":1,"n":17},{"cat":"Geometry","text":"A straight line is split into two angles. One angle measures 118°. What is the measure of the other angle?","explanation":"A straight line makes 180°. 180 − 118 = 62°.","table":null,"choices":["62°","72°","152°","242°"],"answer":0,"n":18},{"cat":"Geometry","text":"How many faces, edges, and vertices does a cube have?","explanation":"A cube (like a number cube) has 6 square faces, 12 edges where faces meet, and 8 corners.","table":null,"choices":["6 faces, 8 edges, 12 vertices","4 faces, 6 edges, 4 vertices","8 faces, 12 edges, 6 vertices","6 faces, 12 edges, 8 vertices"],"answer":3,"n":19},{"cat":"Geometry","text":"A square and a rectangle have the same perimeter. The square has sides of 7 inches. The rectangle is 10 inches long. How wide is the rectangle?","explanation":"Square perimeter: 4 × 7 = 28 in. Rectangle: 10 + 10 = 20, 28 − 20 = 8 for the two widths, 8 ÷ 2 = 4 inches.","table":null,"choices":["3 inches","4 inches","7 inches","18 inches"],"answer":1,"n":20},{"cat":"Measurement","text":"A play started at 6:50 p.m. It had two acts of 45 minutes each and a 15-minute break between them. What time did it end?","explanation":"Total time: 45 + 15 + 45 = 105 minutes = 1 hour 45 minutes. 6:50 + 1 hour = 7:50, + 45 minutes = 8:35 p.m.","table":null,"choices":["7:55 p.m.","8:25 p.m.","8:35 p.m.","8:45 p.m."],"answer":2,"n":21},{"cat":"Measurement","text":"A water tank holds 5 liters. Tamsin pours out 1,750 milliliters. How many milliliters are left? (1 liter = 1,000 milliliters)","explanation":"5 liters = 5,000 mL. 5,000 − 1,750 = 3,250 mL.","table":null,"choices":["3,250 mL","3,750 mL","4,250 mL","6,750 mL"],"answer":0,"n":22},{"cat":"Measurement","text":"Which is longer, 5 feet or 58 inches, and by how much? (1 foot = 12 inches)","explanation":"5 feet = 5 × 12 = 60 inches. 60 − 58 = 2, so 5 feet is longer by 2 inches.","table":null,"choices":["5 feet, by 2 inches","58 inches, by 2 inches","5 feet, by 53 inches","They are the same length"],"answer":0,"n":23},{"cat":"Measurement","text":"A package weighs 2 pounds 5 ounces. How many ounces is that? (1 pound = 16 ounces)","explanation":"2 pounds = 2 × 16 = 32 ounces. 32 + 5 = 37 ounces.","table":null,"choices":["21 ounces","25 ounces","32 ounces","37 ounces"],"answer":3,"n":24},{"cat":"Data Analysis & Probability","text":"The table shows raffle tickets sold by four classes. What is the difference between the most and the fewest tickets sold?","explanation":"Most: Class C, 52. Fewest: Class D, 29. 52 − 29 = 23.","table":[["Class","Tickets sold"],["Class A","46"],["Class B","38"],["Class C","52"],["Class D","29"]],"choices":["13","17","23","81"],"answer":2,"n":25},{"cat":"Data Analysis & Probability","text":"Using the same table, each ticket costs $2. How much money did Classes A and B raise together?","explanation":"Tickets: 46 + 38 = 84. Money: 84 × $2 = $168. (84 is the number of tickets, not dollars.)","table":[["Class","Tickets sold"],["Class A","46"],["Class B","38"],["Class C","52"],["Class D","29"]],"choices":["$84","$86","$168","$176"],"answer":2,"n":26},{"cat":"Data Analysis & Probability","text":"A bag holds 3 red tiles, 5 green tiles, and 4 yellow tiles. What is the probability of picking a green tile without looking?","explanation":"Total tiles: 3 + 5 + 4 = 12. Green: 5. Probability = 5 out of 12.","table":null,"choices":["3 out of 12","4 out of 12","5 out of 7","5 out of 12"],"answer":3,"n":27},{"cat":"Data Analysis & Probability","text":"Jacob recorded the goals he scored in 7 games: 2, 5, 3, 5, 4, 5, 1. What is the range of the data?","explanation":"Range = greatest − least = 5 − 1 = 4.","table":null,"choices":["3","4","5","7"],"answer":1,"n":28}]},{"id":4,"level":"Challenge","passages":[{"title":"The Borrowed Telescope","genre":"Fiction","poem":false,"paragraphs":["Mr. Okafor, who lived next door, owned a telescope that stood on three legs by his window like a long brass heron. When he asked Wren if she would like to borrow it for the weekend, she said yes before he finished the question.","That night, Wren carried the telescope into the backyard and pointed it at the brightest dot in the sky. At first she saw only a blur. Then she turned the focus knob, and Saturn floated into view, wearing its rings like a tilted hat. Wren gasped so loudly that the neighbor’s dog barked.","By Sunday evening her fingers were stiff with cold. As she twisted the small eyepiece to change it, it slipped from her cold hand and bounced off the stone patio. When she picked it up, a thin scratch ran across the glass.","Wren sat on the back step for a long time. She could put it back and say nothing. Mr. Okafor might not notice for weeks. But every time she imagined him looking through it, her stomach twisted. Finally she walked next door, holding the eyepiece in both hands, and told him exactly what had happened. She offered him the birthday money she had been saving.","Mr. Okafor turned the eyepiece over in the porch light. “Eyepieces can be replaced,” he said. “People who tell the truth when it’s hard are rarer.” He opened a drawer, took out a spare eyepiece, and handed it to her. “Same time next weekend?” he asked."]},{"title":"Rivers of Ice: How Glaciers Shape the Land","genre":"Nonfiction / Science","poem":false,"paragraphs":["A glacier is a huge mass of ice that moves slowly over land. Glaciers form in places where more snow falls each winter than melts each summer. Year after year, the snow piles up and is pressed into thick, solid ice.","Although glaciers look still, they are always moving. Their own great weight makes them slide and flow downhill, usually only a few centimeters to a few meters a day. As a glacier creeps along, it acts like a giant piece of sandpaper. Rocks frozen into its bottom scrape and grind the ground beneath, carving deep valleys and smoothing hills.","Glaciers also carry rocks for long distances. When a glacier melts, it leaves behind boulders that may be very different from the rock around them. Scientists call these stones erratics, because they seem to be out of place. A single boulder sitting alone in a flat field may have ridden on a glacier many miles from its home.","Long ago, during the last ice age, giant sheets of ice covered much of North America. As they moved and melted, they helped dig out the basins that hold the Great Lakes. Today, many glaciers around the world are shrinking. Scientists study them closely, because glaciers store much of Earth’s fresh water, and their melting can cause sea levels to rise."]},{"title":"Katherine Johnson: The Woman Who Checked the Math","genre":"Biography","poem":false,"paragraphs":["Katherine Johnson grew up in West Virginia in the early 1900s. As a child, she counted everything she could: steps to church, dishes in the sink, stars in the sky. She loved numbers so much that she started high school at age ten and graduated from college at eighteen.","In 1953, she began working at a research center that later became part of NASA. Her job title was “computer.” Before electronic computers were common, people with this title did long, careful calculations by hand. At that time, laws in Virginia forced Black workers like Katherine to use separate offices and lunchrooms. She did her work so well, however, that engineers soon asked for her by name.","Katherine calculated trajectories, the exact paths that spacecraft would follow through space and back to Earth. In 1962, the astronaut John Glenn was preparing to become the first American to orbit Earth. NASA now used electronic computers to plan the flight, but Glenn did not fully trust them yet. He asked that Katherine check the machine’s numbers. “If she says they’re good,” he said, “then I’m ready to go.”","Her numbers matched, and the flight was a success. Katherine went on to help with many other missions, including the 1969 flight that landed astronauts on the Moon. In 2015, when she was ninety-seven years old, she received the Presidential Medal of Freedom, one of the highest honors in the United States."]},{"title":"The Pencil’s Song","genre":"Poetry","poem":true,"paragraphs":["I am a pencil, short and plain,\nwith tooth marks on my yellow coat.\nBut I’ve traveled many miles of page\nand carried every word you wrote.","I drew your dragons, ships, and castle walls,\nI solved your sums and spelled your name.\nEach mistake you rubbed away\ntook a bit of me, all the same.","I gave it gladly, line by line,\nand now I’m worn down to a nub—\nso keep me in your pencil cup\nand don’t forget the work we’ve done."]},{"title":"Folding Into Space: Origami Engineering","genre":"Nonfiction / Science","poem":false,"paragraphs":["Origami is the art of folding paper into shapes such as birds, flowers, and boxes without cutting or gluing. For hundreds of years it was mostly a craft. Today, engineers have discovered that the same folds can solve a very modern problem: fitting large objects into small spaces.","Consider a spacecraft that needs large solar panels to collect sunlight for power. The panels must be wide to work well, but a rocket has only a narrow space inside its nose for cargo. Engineers solved this problem by designing panels that fold up tightly like origami and then open once the spacecraft reaches space.","One famous pattern was created by a Japanese scientist named Koryo Miura. In the Miura fold, a flat sheet is folded into a zigzag of small parallelograms. When someone pulls on two opposite corners, the whole sheet opens in one smooth motion. The same fold has also been used to make maps that open and close easily.","Origami ideas are useful on Earth too. Engineers are testing emergency shelters that fold flat for shipping, tiny medical devices that unfold inside the body, and robots that can fold themselves into new shapes. An art that began with a single square of paper is helping people build the future."]}],"reading":[{"passage":0,"cat":"Tone & Figurative Language","text":"The author compares the telescope to “a long brass heron” mainly to help the reader picture —","explanation":"A heron is a tall bird with long, thin legs. The telescope stood on three legs, tall and thin.","evidence":{"para":0,"text":"like a long brass heron"},"choices":["its tall, thin shape standing on legs","the bird Wren saw through it","the sound it made when it moved","how old Mr. Okafor was"],"answer":0,"n":1},{"passage":0,"cat":"Inference","text":"Wren said yes “before he finished the question.” This detail shows that Wren —","explanation":"Answering before he even finished shows she really wanted to borrow it.","evidence":{"para":0,"text":"she said yes before he finished the question"},"choices":["did not understand the question","was very eager to use the telescope","wanted to be rude","had a telescope of her own"],"answer":1,"n":2},{"passage":0,"cat":"Supporting Details","text":"How did the eyepiece get scratched?","explanation":"Paragraph 3 says it slipped from her cold hand and bounced off the stone patio.","evidence":{"para":2,"text":"it slipped from her cold hand and bounced off the stone patio"},"choices":["The neighbor’s dog knocked it over.","Mr. Okafor dropped it.","It slipped from Wren’s cold hand and hit the patio.","Wren scratched it while cleaning it."],"answer":2,"n":3},{"passage":0,"cat":"Inference","text":"What is Wren’s main problem in paragraph 4?","explanation":"She could say nothing, but her stomach twists. She struggles with telling the truth.","evidence":{"para":3,"text":"She could put it back and say nothing."},"choices":["She cannot find Saturn in the sky.","She is locked out of her house.","She has lost her birthday money.","She must decide whether to admit what she did."],"answer":3,"n":4},{"passage":0,"cat":"Inference","text":"What does Mr. Okafor mean when he says honest people “are rarer”?","explanation":"He compares a replaceable eyepiece with honesty. Honesty is rarer, so it matters more to him.","evidence":{"para":4,"text":"People who tell the truth when it’s hard are rarer."},"choices":["Honesty is harder to find, and more valuable, than an eyepiece.","He has many spare people in his drawer.","He is angry that Wren broke his telescope.","He wants Wren to pay him back."],"answer":0,"n":5},{"passage":0,"cat":"Main Idea","text":"Which statement best expresses the theme of the story?","explanation":"Because Wren was honest, Mr. Okafor trusts her and invites her to borrow it again.","evidence":{"para":4,"text":"Same time next weekend?"},"choices":["Telescopes are too fragile for children.","Telling the truth about a mistake can build trust.","It is best to hide small accidents.","Saturn is the most beautiful planet."],"answer":1,"n":6},{"passage":1,"cat":"Supporting Details","text":"According to the passage, glaciers form where —","explanation":"Paragraph 1 explains the snow builds up year after year and is pressed into ice.","evidence":{"para":0,"text":"more snow falls each winter than melts each summer"},"choices":["rivers freeze for a single night","the ground is warm all year","more snow falls each winter than melts each summer","rain falls more often than snow"],"answer":2,"n":7},{"passage":1,"cat":"Tone & Figurative Language","text":"The author says a glacier “acts like a giant piece of sandpaper.” This comparison shows that a glacier —","explanation":"Sandpaper scrapes and smooths surfaces. Rocks in the glacier grind the land the same way.","evidence":{"para":1,"text":"acts like a giant piece of sandpaper"},"choices":["is rough and brown in color","is used by builders","moves very quickly","rubs and wears away the ground beneath it"],"answer":3,"n":8},{"passage":1,"cat":"Vocabulary in Context","text":"Based on paragraph 3, the word erratics most likely refers to rocks that —","explanation":"The author explains they are called erratics “because they seem to be out of place.”","evidence":{"para":2,"text":"because they seem to be out of place"},"choices":["seem out of place where they are found","are the smallest rocks in a valley","are made of ice","are found only at the bottom of lakes"],"answer":0,"n":9},{"passage":1,"cat":"Inference","text":"A hiker finds one huge boulder in the middle of a flat field with no other large rocks nearby. Based on the passage, the best explanation is that the boulder —", m paragraph 1 best shows Katherine’s early love of numbers?","explanation":"Counting everything around her shows how much she enjoyed numbers.","evidence":{"para":0,"text":"she counted everything she could"},"choices":["She grew up in West Virginia.","She counted steps, dishes, and stars.","She lived in the early 1900s.","She went to church."],"answer":1,"n":14},{"passage":2,"cat":"Vocabulary in Context","text":"In paragraph 3, the word trajectories means —","explanation":"The passage defines it: “the exact paths that spacecraft would follow.”","evidence":{"para":2,"text":"the exact paths that spacecraft would follow"},"choices":["the speed of a computer","the names of astronauts","the paths that objects follow as they move","the tools used to build rockets"],"answer":2,"n":15},{"passage":2,"cat":"Inference","text":"Why did John Glenn ask Katherine to check the computer’s numbers?","explanation":"Glenn did not fully trust the new machines yet. He said if she approved the numbers, he was ready.","evidence":{"para":2,"text":"Glenn did not fully trust them yet"},"choices":["The computer had stopped working.","She was the only person at NASA.","He wanted her to fly with him.","He trusted her skill more than the new machines."],"answer":3,"n":16},{"passage":2,"cat":"Organization & Logic","text":"How does the author mainly organize the passage?","explanation":"It moves from childhood (paragraph 1) to 1953, 1962, 1969, and 2015.","evidence":{"para":3,"text":"In 2015, when she was ninety-seven years old"},"choices":["In time order, from Katherine’s childhood to her later honors","By comparing Katherine to John Glenn","As a list of problems with computers","By explaining how to calculate a trajectory"],"answer":0,"n":17},{"passage":2,"cat":"Main Idea","text":"Which sentence would make the best summary of the passage?","explanation":"The passage shows how her calculations were trusted for Glenn’s flight and the Moon landing.","evidence":{"para":3,"text":"Her numbers matched, function score(rec, s){

  const all = []; for (const [s, sc] of [['R',R],['M',M]]) for (const [c, v] of Object.entries(sc.cats)) all.push({s, cat:c, ok:v.c, t:v.t, p:v.c/v.t});
  const weak = all.filter(x => x.ok < x.t).sort((a,b) => a.p - b.p || b.t - a.t).slice(0, 3);
  const sect = (s, sc) => `<h3>${SECS[s].name}: ${sc.raw} / ${sc.total} correct (${sc.pct}%)</h3>
    <table class="grid cat-table" data-sec="${s}"><tr><th>Category</th><th>Correct</th><th style="width:22%">Percent</th><th>Item results (${SECS[s].pre}-1 →)</th></tr>
    ${Object.entries(sc.cats).map(([c, v]) => `<tr><td>${esc(c)}</td><td><b>${v.c}/${v.t}</b></td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.round(100*v.c/v.t)}%"></i></div>${Math.round(100*v.c/v.t)}%</div></td><td class="marks">${markHTML(v.marks)}</td></tr>`).join('')}
    </table><div class="marks" style="margin-top:6px">All items: ${markHTML(sc.marks.join(''))}</div>`;
  const timeSec = (s, sc) => { const X = r.S[s]; const it = items(r.testId, s);
    const rush = [], slow = []; X.times.forEach((t, i) => { if (X.answers[i] != null && t < RUSH_MS) rush.push(i); if (t > SLOW_MS) slow.push(i); });
    return `<h3>${SECS[s].short}: time per question</h3><p class="muted" style="margin:0 0 6px">Total ${secs(X.times.reduce((a,b)=>a+b,0))} · average ${secs(X.times.reduce((a,b)=>a+b,0)/28)} per question.
      <b>${rush.length}</b> rushed (answered in under ${RUSH_MS/1000}s)${rush.length ? ': ' + rush.map(i => SECS[s].pre+'-'+(i+1)).join(', ') : ''}. <b>${slow.length}</b> slow (over ${SLOW_MS/60000} min)${slow.length ? ': ' + slow.map(i => SECS[s].pre+'-'+(i+1)).join(', ') : ''}.</p>
      <div class="tchips">${X.times.map((t, i) => `<span class="tchip ${X.answers[i]!=null && t<RUSH_MS?'rush':''} ${t>SLOW_MS?'slow':''} ${sc.marks[i]!=='+'?'wr':''}" title="${esc(it[i].cat)}">${SECS[s].pre}-${i+1}: ${secs(t)}</span>`).join('')}</div>`; };
  return `<div class="page" id="report">
   <div class="card"><div class="row"><div style="flex:1"><h1 style="margin:0">Score Report</h1>
     <div class="muted">${esc(r.name)} · Practice Test ${r.testId} (${tst.level === 'Standard' ? 'on level' : 'challenge'}) · ${new Date(r.date).toLocaleString()}${r.practice ? ' · untimed practice' : ''}</div></div>
     <div class="row noprint"><button class="btn sec" id="printbtn" onclick="print()">Print report</button></div></div>
   <div class="score" style="margin-top:12px">
     <div class="box"><div class="muted">Reading</div><div class="big" id="scoreR">${R.raw}/28</div>${R.pct}% correct</div>
     <div class="box"><div class="muted">Mathematics</div><div class="big" id="scoreM">${M.raw}/28</div>${M.pct}% correct</div>
     <div class="box"><div class="muted">Total</div><div class="big" id="scoreT">${R.raw+M.raw}/56</div>${Math.round(100*(R.raw+M.raw)/56)}% correct</div></div>
   <p class="muted" style="font-size:13px;margin-bottom:0">These are raw scores (number correct) for this practice test only. Real score reports use scaled scores, percentiles, and stanines, which a practice test cannot predict.</p></div>
   <div class="card noprint"><h2>Review answers</h2><p style="margin-top:0">Go through each question in the test screen and see your answer, the correct answer, and why.</p>
     <div class="row"><button class="btn" id="rvR" onclick="openAnswers('R')">Review Reading answers</button><button class="btn" id="rvM" onclick="openAnswers('M')">Review Math answers</button></div></div>
   <div class="card"><h2>Analysis by question type</h2>
     <p class="muted" style="margin-top:0">Key: <span class="marks"><span class="p">+</span></span> correct · <span class="marks"><span class="m">−</span></span> incorrect · <span class="marks"><span class="s">S</span></span> skipped · <span class="marks"><span class="n">N</span></span> not reached (time ran out before the item was seen)</p>
     ${sect('R', R)}${sect('M', M)}</div>
   <div class="card" id="mistakes"><h2>Mistakes to practice</h2>
     ${weak.length ? `<p class="muted" style="margin-top:0">Your three weakest question types on this test, with a tip for each:</p>` + weak.map(w => `<div class="tip"><b>${esc(w.cat)}</b> (${SECS[w.s].short}) — ${w.ok}/${w.t} correct (${Math.round(100*w.p)}%)<div>${esc(TIPS[w.cat] || '')}</div></div>`).join('') : '<p>Every question type was 100% correct. Try a Challenge test next!</p>'}
   </div>
   <div class="card" id="timing"><h2>Time spent</h2>${timeSec('R', R)}${timeSec('M', M)}
     <p class="muted" style="font-size:13px">Orange = answered very quickly (check for careless mistakes). Blue = took a long time (practice moving on and coming back). Red underline = not correct.</p></div>
   <div class="card noprint"><div class="row"><button class="btn sec" onclick="openHistory()">Score history for ${esc(r.name)}</button><button class="btn sec" onclick="UI.screen='start';render()">Back to start</button></div></div>
  </div>`;
}
function openAnswers(s){ UI.rv = {s, filter:'all', i:0}; UI.screen = 'answers'; render(); }

// ---------- answer review mode ----------
function rvList(r, s, f){ const sc = score(r, s), X = r.S[s];
  return [...Array(28).keys()].filter(i => f === 'all' ? true : f === 'incorrect' ? sc.marks[i] === '-' : f === 'flagged' ? X.flags[i] : (sc.marks[i] === 'S' || sc.marks[i] === 'N')); }
function vAnswers(){
  const r = UI.result, rv = UI.rv, s = rv.s, X = r.S[s], tst = T(r.testId), it = items(r.testId, s), sc = score(r, s);
  const list = rvList(r, s, rv.filter); const counts = {all:28, incorrect:rvList(r,s,'incorrect').length, flagged:rvList(r,s,'flagged').length, skipped:rvList(r,s,'skipped').length};
  const fb = ['all','incorrect','flagged','skipped'].map(f => `<button class="fbtn ${rv.filter===f?'on':''}" id="f-${f}" onclick="UI.rv.filter='${f}';UI.rv.i=0;UI.rv.ev=false;render()">${f[0].toUpperCase()+f.slice(1)} (${counts[f]})</button>`).join('');
  const top = hdr(`Answer Review — ${SECS[s].name}`, list.length ? `Question ${list[rv.i]+1} of 28` : 'No items') .replace('id="clock"', 'id="clock" style="visibility:hidden"');
  const bar = `<div class="toolbar"><b style="font-size:14px;color:var(--navy)">Show:</b>${fb}<span class="sp"></span>
     <button class="tb" onclick="zoom(1)">${ICON.zin}</button><button class="tb" onclick="zoom(-1)">${ICON.zout}</button>
     <button class="tb" id="otherSec" onclick="openAnswers('${s === 'R' ? 'M' : 'R'}')">Go to ${s === 'R' ? 'Math' : 'Reading'}</button>
     <button class="tb" id="backReport" onclick="UI.screen='report';render()">Back to report</button></div>`;
  if (!list.length) return top + bar + `<div class="main single"><div class="pane question"><p id="emptyfilter">No ${rv.filter} questions in this section. Nice!</p></div></div>`;
  const i = list[rv.i], q = it[i], a = X.answers[i], m = sc.marks[i];
  const status = m === '+' ? '<span class="ok">Correct</span>' : m === '-' ? '<span class="flg">Incorrect</span>' : m === 'N' ? '<span style="color:#7b8794;font-weight:800">Not reached</span>' : '<span style="color:var(--amber);font-weight:800">Skipped</span>';
  const choices = q.choices.map((c, k) => { const right = k === q.answer, wrong = k === a && a !== q.answer;
     return `<div class="choice ${right?'right':''} ${wrong?'wrong':''}"><div class="pick" style="cursor:default"><span class="bub">${L(k)}</span><span class="ctext">${esc(c)}</span>${right ? `<span class="ctag">${a===k?'✔ Your answer — correct':'✔ Correct answer'}</span>` : wrong ? '<span class="ctag">✘ Your answer</span>' : ''}</div></div>`; }).join('');
  const reading = s === 'R', p = reading ? tst.passages[q.passage] : null;
  const t = X.times[i]; const tflag = a != null && t < RUSH_MS ? ' · <span style="color:#e65100;font-weight:700">rushed</span>' : t > SLOW_MS ? ' · <span style="color:#1565c0;font-weight:700">slow</span>' : '';
  return top + bar + `<div class="main ${reading?'split':'single'}">
    ${reading ? `<div class="pane passage ${p.poem?'poem':''}" id="passage">${passageHTML(q.passage, p, {ev: rv.ev ? q.evidence : null})}</div>` : ''}
    <div class="pane question" id="qpane"><div class="muted" style="font-size:.75em;margin-bottom:6px" id="rvmeta"><b>${SECS[s].pre}-${i+1}</b> · ${esc(q.cat)} · ${status}${X.flags[i] ? ' · <span class="flg">flagged</span>' : ''} · time ${secs(t)}${tflag}</div>
      <div class="qtext">${esc(q.text)}</div>${tableHTML(q.table)}${choices}
      <div class="expl" id="expl"><b>Explanation:</b> ${esc(q.explanation)}
      ${reading ? `<div style="margin-top:8px"><button class="btn sec small" id="showev" onclick="UI.rv.ev=!UI.rv.ev;UI.scrollEv=UI.rv.ev;render()">${rv.ev ? 'Hide' : 'Show'} in passage</button></div>` : ''}</div></div></div>
   <div class="foot"><button class="btn green" id="rprev" onclick="rvGo(-1)" ${rv.i===0?'disabled':''}>« Previous</button><span class="muted">${rv.i+1} of ${list.length} (${rv.filter})</span><span class="sp"></span>
     <button class="btn green" id="rnext" onclick="rvGo(1)" ${rv.i===list.length-1?'disabled':''}>Next »</button></div>`;
}
function rvGo(d){ UI.rv.i += d; UI.rv.ev = false; render(); }

// ---------- history ----------
function openHistory(){ const n = (UI.result && UI.screen === 'report') ? UI.result.name : (UI.name || '').trim(); UI.hist = n; UI.screen = 'history'; render(); }
function vHistory(){
  const all = hist(); const n = UI.hist; const H = n ? all.filter(r => nameKey(r.name) === nameKey(n)) : all;
  const names = [...new Map(all.map(r => [nameKey(r.name), r.name])).values()];
  const scored = H.map(r => ({r, R:score(r,'R'), M:score(r,'M')}));
  const cats = [...new Set(TESTS.flatMap(t => [...t.reading, ...t.math].map(q => q.cat)))];
  const trend = c => { const pts = scored.map(x => x.R.cats[c] || x.M.cats[c]).filter(Boolean).map(v => Math.round(100*v.c/v.t));
     if (!pts.length) return ''; const d = pts.length > 1 ? pts[pts.length-1] - pts[0] : 0;
     return `<tr><td>${esc(c)}</td><td>${pts.map(p => p + '%').join(' → ')}</td><td>${pts.length > 1 ? (d > 0 ? `<span class="ok">▲ ${d}</span>` : d < 0 ? `<span class="flg">▼ ${-d}</span>` : '—') : ''}</td></tr>`; };
  return `<div class="page" id="history"><div class="card"><h1 style="margin:0">Score history${n ? ' — ' + esc(n) : ''}</h1>
    <p class="muted" style="margin-top:4px"><b>Saved on this device only</b> (in this browser's storage). It is not sent anywhere, and it will not appear on another computer or browser.</p>
    ${names.length > 1 ? `<div class="row">${names.map(x => `<button class="btn sec small" data-n="${esc(x)}" onclick="UI.hist=this.dataset.n;render()">${esc(x)}</button>`).join('')}<button class="btn sec small" onclick="UI.hist='';render()">Everyone</button></div>` : ''}
    ${scored.length ? `<table class="grid" id="histtable" style="margin-top:10px"><tr><th>Date</th>${n ? '' : '<th>Student</th>'}<th>Test</th><th>Reading</th><th>Math</th><th>Total</th><th></th></tr>
      ${scored.map(x => `<tr><td>${new Date(x.r.date).toLocaleDateString()} ${new Date(x.r.date).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</td>${n ? '' : `<td>${esc(x.r.name)}</td>`}<td>Practice Test ${x.r.testId}${x.r.practice ? ' (untimed)' : ''}</td><td>${x.R.raw}/28 (${x.R.pct}%)</td><td>${x.M.raw}/28 (${x.M.pct}%)</td><td><b>${x.R.raw + x.M.raw}/56</b></td><td><button class="btn sec small" onclick="UI.result=hist().find(h=>h.id===${x.r.id});UI.screen='report';render()">Report</button></td></tr>`).join('')}</table>
      <h3>Category trends (oldest → newest)</h3><table class="grid" id="trends"><tr><th>Category</th><th>Percent correct by attempt</th><th>Change</th></tr>${cats.map(trend).join('')}</table>`
    : '<p>No finished tests yet.</p>'}
    <div class="row noprint" style="margin-top:14px"><button class="btn sec" onclick="UI.screen='start';render()">Back to start</button>
      ${H.length ? `<button class="btn sec" onclick="clearHist()">Delete ${n ? esc(n) + "'s" : 'all'} history on this device</button>` : ''}</div></div></div>`;
}
function clearHist(){ if (!confirm('Delete these saved scores from this device?')) return; const n = UI.hist; saveJ(LS_HIST, n ? hist().filter(r => nameKey(r.name) !== nameKey(n)) : []); render(); }

// ---------- clock loop ----------
function updateClock(){
  const el = $('#clockv'); if (!el || !RUN) return;
  const S = RUN.S[RUN.stage]; if (!S) return;
  const box = $('#clock');
  if (RUN.practice) { el.textContent = mmss(Date.now() - S.started); box.title = 'Untimed practice (time used)'; return; }
  const left = S.deadline - Date.now(); el.textContent = mmss(left);
  box.classList.toggle('warn', left <= WARN_AT && left > 60000); box.classList.toggle('crit', left <= 60000);
}
setInterval(() => {
  if (!RUN) return;
  if ((RUN.stage === 'R' || RUN.stage === 'M') && (UI.screen === 'test' || UI.screen === 'review')) {
    accrue(); const S = curS();
    if (!RUN.practice && S.deadline) {
      const left = S.deadline - Date.now();
      if (left <= 0) return endSection(true);
      if (left <= WARN_AT && !UI.warned[RUN.stage]) { UI.warned[RUN.stage] = true; if (UI.screen === 'test') render(); }
      const wb = $('#warnbar'); if (wb) wb.textContent = mmss(left) + ' remaining in this section.';
      if (UI.screen === 'review') { const f = $('#finish'); if (f && f.disabled && canFinish()) render(); }
    }
    updateClock(); saveRun();
  } else if (RUN.stage === 'brk' && UI.screen === 'brk') {
    const left = RUN.breakEnd - Date.now(); const c = $('#brkclock'); if (c) c.textContent = mmss(left); if (left <= 0) endBreak();
  }
}, 250);
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });
render();
</script>
</body>
